name: Foreground restore

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foreground-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and build plugin without publishing
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          publish: 'false'
          build: 'true'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm test
