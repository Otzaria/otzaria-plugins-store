<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חנות תוספים</title>
  <!-- מילוני התרגום מוטמעים בתוסף (ללא רשת). שפה ללא מילון נשארת בעברית. -->
  <script src="i18n/en.js"></script>
  <style>
    /* ── טוקני עיצוב (ערכים זהים למקור) ── */
    :root {
      --color-surface: #f7f3ee;
      --color-surface-card: #fff;
      --color-surface-soft: #faf7f3;
      --color-surface-muted: #f0ece8;
      /* רקע פס הכותרת — surfaceContainerHigh של אוצריא (ראה applyTheme) */
      --color-surface-container-high: #f0e9df;
      --color-on-surface: #2c1b02;
      --color-accent: #2c1b02;
      --color-on-accent: #fff;
      --color-primary-hover: #1a1000;
      --color-text: #5a4020;
      --color-text-muted: #7a6040;
      --color-text-faint: #9a7a50;
      --color-icon-faint: #b0956a;
      --color-outline: #e8ddd0;
      --color-outline-strong: #d9ccbe;
      --color-divider: #ede4d8;
      --color-placeholder: #f0e8dc;
      --color-error: #8a3010;
      --color-badge-stable-bg: #e8f0e0;
      --color-badge-stable-fg: #3a6020;
      --color-badge-beta-bg: #f0e8d0;
      --color-badge-beta-fg: #7a5010;
      --color-badge-exp-bg: #f5e8e0;
      /* דירוגים — הכוכב המלא ומסילת הכוכבים הריקים. אין להם תפקיד מתאים
         ב-theme של אוצריא, ולכן הם מקומיים כמו תגיות הסטטוס. */
      --color-rating-star: #c98a05;
      --color-rating-track: #ded3c4;
      --color-shadow-card: rgba(44,27,2,.12);
      --color-shadow-modal: rgba(44,27,2,.18);
      --color-shadow-toast: rgba(44,27,2,.32);
      --color-scrim: rgba(44,27,2,.4);
      --color-scrim-dark: rgba(0,0,0,.85);
      --color-overlay-light: rgba(255,255,255,.15);
      --color-overlay-light-hover: rgba(255,255,255,.3);
      --font-main: 'Segoe UI', Arial, sans-serif;
      --fs-11: 11px; --fs-12: 12px; --fs-13: 13px; --fs-14: 14px;
      --fs-15: 15px; --fs-16: 16px; --fs-18: 18px; --fs-22: 22px;
      --fs-24: 24px; --fs-32: 32px; --fs-40: 40px; --fs-48: 48px;
      /* גדלי פס הכותרת — px קשיח בכוונה (DESIGN_GUIDE § סרגל כותרת התוסף):
         הפס חייב להתיישר עם הסרגל של אוצריא ולא לגדול עם גופן הספר */
      --fs-topbar-title: 16px; --fs-topbar-sub: 12px;
      --radius-3: 3px; --radius-6: 6px; --radius-8: 8px; --radius-10: 10px;
      --radius-12: 12px; --radius-14: 14px; --radius-16: 16px; --radius-18: 18px;
      --radius-20: 20px; --radius-24: 24px;
      /* טקסט/אייקון מעל שכבה חוצצת כהה (lightbox) — תמיד בהיר, גם במצב כהה */
      --color-on-scrim: #fff;
    }

    /* ── מצב כהה: רוב הצבעים מגיעים מ-theme של אוצריא (applyTheme).
       כאן רק טוקנים שה-theme אינו מספק — צללים, שכבות חוצצות, ותגיות סטטוס. ── */
    body.dark-mode {
      --color-badge-stable-bg: #21311f;
      --color-badge-stable-fg: #a3cf86;
      --color-badge-beta-bg: #34301a;
      --color-badge-beta-fg: #e0bd66;
      --color-badge-exp-bg: #3a261c;
      --color-rating-star: #e0bd66;
      --color-rating-track: #4a4034;
      --color-shadow-card: rgba(0,0,0,.45);
      --color-shadow-modal: rgba(0,0,0,.55);
      --color-shadow-toast: rgba(0,0,0,.6);
      --color-scrim: rgba(0,0,0,.6);
      --color-scrim-dark: rgba(0,0,0,.88);
    }

    /* פס הכותרת קבוע והתוכן הוא שגולל — לכן העמוד עצמו אינו גולל כלל */
    html, body { height: 100%; overflow: hidden; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-main);
      background: var(--color-surface);
      color: var(--color-on-surface);
    }

    .app-shell { display: flex; flex-direction: column; height: 100%; }
    .app-content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }

    /* ── סרגל כותרת התוסף (Top Bar) ──
       אוצריא אינה מציירת כותרת מעל ה-WebView, ולכן שם התוסף יושב בפס עליון קבוע
       ברקע surfaceContainerHigh — אותו צבע וגובה כמו הסרגל העליון של מסכי הספרים.
       הגדלים כאן ב-px קשיחים בכוונה (יחידות יחסיות היו מתפוצצות עם גופן ספר גדול). */
    .topbar {
      background: var(--color-surface-container-high);
      border-bottom: 1px solid var(--color-outline);
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar h1 {
      margin: 0;
      font-size: var(--fs-topbar-title);
      font-weight: 600;
      color: var(--color-on-surface);
      white-space: nowrap;
    }
    #plugin-count {
      flex: 1;
      min-width: 0;
      font-size: var(--fs-topbar-sub);
      color: var(--color-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 600px) {
      .topbar { height: 44px; padding: 0 10px; }
    }

    #refresh-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--color-outline-strong);
      background: var(--color-surface-soft);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: var(--fs-16);
      transition: background .15s, border-color .15s;
      flex-shrink: 0;
    }
    #refresh-btn:hover { background: var(--color-surface-muted); border-color: var(--color-on-surface); }
    #refresh-btn.spinning { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── פילטרים ── */
    #filters {
      background: var(--color-surface-card);
      padding: 12px 20px;
      border-bottom: 1px solid var(--color-outline);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    #search {
      flex: 1;
      min-width: 180px;
      padding: 8px 12px;
      border: 1px solid var(--color-outline-strong);
      border-radius: var(--radius-8);
      font-size: var(--fs-14);
      background: var(--color-surface-soft);
      color: var(--color-on-surface);
      outline: none;
    }
    #search::placeholder { color: var(--color-text-faint); }
    #search:focus { border-color: var(--color-on-surface); }

    #status-filter {
      padding: 8px 12px;
      border: 1px solid var(--color-outline-strong);
      border-radius: var(--radius-8);
      font-size: var(--fs-14);
      background: var(--color-surface-soft);
      color: var(--color-on-surface);
      outline: none;
    }

    /* ── סוויץ' "הסתר מותקנים" ── */
    #hide-installed-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-13);
      font-weight: 600;
      color: var(--color-text);
      cursor: pointer;
      white-space: nowrap;
      user-select: none;
    }
    #hide-installed-wrap input { display: none; }
    #hide-installed-wrap .switch {
      width: 34px; height: 18px;
      border-radius: var(--radius-20);
      background: var(--color-outline-strong);
      position: relative;
      transition: background .15s;
      flex-shrink: 0;
    }
    /* מיקום לוגי (inset-inline) — הידית נעה נכון גם ב-rtl וגם ב-ltr */
    #hide-installed-wrap .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      inset-inline-start: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--color-surface-card);
      transition: inset-inline-start .15s;
    }
    #hide-installed-wrap input:checked + .switch { background: var(--color-accent); }
    #hide-installed-wrap input:checked + .switch::after { inset-inline-start: 18px; }

    /* ── תגיות ── */
    #tags-wrap { background: var(--color-surface-soft); border-bottom: 1px solid var(--color-divider); }
    #tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 6px; }
    #tags.collapsed { overflow: hidden; }
    #tags-toggle {
      display: block;
      margin: 0 20px 10px;
      padding: 4px 14px;
      border-radius: var(--radius-20);
      font-size: var(--fs-12);
      font-weight: 600;
      cursor: pointer;
      border: 1px dashed var(--color-outline-strong);
      background: var(--color-surface-card);
      color: var(--color-text);
      transition: all .15s;
    }
    #tags-toggle:hover { border-color: var(--color-on-surface); color: var(--color-on-surface); }
    .tag-btn {
      padding: 4px 12px;
      border-radius: var(--radius-20);
      font-size: var(--fs-12);
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--color-outline-strong);
      background: var(--color-surface-card);
      color: var(--color-text);
      transition: background-color .15s, color .15s, border-color .15s;
    }
    .tag-btn:hover { border-color: var(--color-on-surface); color: var(--color-on-surface); }
    .tag-btn.active { background: var(--color-accent); color: var(--color-on-accent); border-color: var(--color-accent); }

    /* ── רשת כרטיסים ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 20px;
    }

    .card {
      background: var(--color-surface-card);
      border-radius: var(--radius-14);
      border: 1px solid var(--color-outline);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow .2s, transform .2s;
      cursor: pointer;
    }
    .card:hover { box-shadow: 0 6px 24px var(--color-shadow-card); transform: translateY(-2px); }

    .card-img {
      width: 100%;
      aspect-ratio: 16/11;
      object-fit: cover;
      background: var(--color-surface-card);
    }
    .card-img.is-default { object-fit: contain; padding: 16px; }
    .card-img-placeholder {
      width: 100%;
      aspect-ratio: 16/11;
      background: linear-gradient(135deg, var(--color-placeholder), var(--color-outline));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-32);
      color: var(--color-icon-faint);
    }

    .card-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

    .card-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .badge {
      padding: 2px 10px;
      border-radius: var(--radius-20);
      font-size: var(--fs-11);
      font-weight: 700;
    }
    .badge-stable   { background: var(--color-badge-stable-bg); color: var(--color-badge-stable-fg); }
    .badge-beta     { background: var(--color-badge-beta-bg); color: var(--color-badge-beta-fg); }
    .badge-experimental { background: var(--color-badge-exp-bg); color: var(--color-error); }
    .badge-version  { background: var(--color-surface-muted); color: var(--color-text); }
    .badge-downloads {
      background: var(--color-surface-muted);
      color: var(--color-text-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .badge-downloads svg { width: 12px; height: 12px; }
    .badge-rating {
      background: var(--color-surface-muted);
      color: var(--color-text-muted);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .badge-rating-count { color: var(--color-text-faint); }

    /* חמישה כוכבים בשתי שכבות: מסילה ריקה ומעליה שכבה צבועה שנחתכת ברוחב
       באחוזים. כך גם דירוג של 4.6 מוצג נכון בלי אייקון חצי-כוכב. */
    .stars { position: relative; display: inline-flex; line-height: 0; flex: none; }
    .stars-base { display: inline-flex; color: var(--color-rating-track); }
    .stars-fill {
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      display: inline-flex;
      overflow: hidden;
      color: var(--color-rating-star);
    }
    .stars svg { width: 12px; height: 12px; flex: none; }
    .stars-lg svg { width: 17px; height: 17px; }

    /* לוח הדירוגים בדף הפרטים */
    .rating-summary { display: flex; align-items: center; gap: 16px; }
    .rating-score { text-align: center; flex: none; }
    .rating-score-num { font-size: var(--fs-32); font-weight: 700; color: var(--color-on-surface); }
    .rating-score-meta { font-size: var(--fs-11); color: var(--color-text-faint); margin-top: 3px; }
    .rating-rows { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: var(--fs-11);
      color: var(--color-text-muted);
    }
    .rating-row-star { display: inline-flex; align-items: center; gap: 2px; flex: none; }
    .rating-row-star svg { width: 10px; height: 10px; color: var(--color-rating-star); }
    .rating-bar {
      flex: 1;
      height: 6px;
      border-radius: var(--radius-3);
      background: var(--color-surface-muted);
      overflow: hidden;
      min-width: 0;
    }
    .rating-bar-fill { display: block; height: 100%; background: var(--color-rating-star); border-radius: var(--radius-3); }
    .rating-row-count { flex: none; min-width: 22px; text-align: start; }
    .rating-note { font-size: var(--fs-11); color: var(--color-text-faint); margin-top: 12px; }
    .rating-verified { color: var(--color-badge-stable-fg); font-weight: 700; }
    .rating-empty { font-size: var(--fs-13); color: var(--color-text-muted); }

    .card-title { font-size: var(--fs-16); font-weight: 700; color: var(--color-on-surface); }
    .card-desc  { font-size: var(--fs-13); color: var(--color-text); line-height: 1.5; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 3; line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .card-tag {
      padding: 2px 8px;
      border-radius: var(--radius-20);
      font-size: var(--fs-11);
      background: var(--color-surface-muted);
      color: var(--color-text-muted);
    }

    .card-actions { display: flex; gap: 8px; }
    .btn {
      flex: 1;
      padding: 8px 12px;
      border-radius: var(--radius-20);
      font-size: var(--fs-13);
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      border: none;
      transition: all .15s;
    }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-primary { background: var(--color-accent); color: var(--color-on-accent); }
    .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
    .btn-secondary { background: var(--color-surface-card); color: var(--color-on-surface); border: 1.5px solid var(--color-outline-strong); }
    .btn-secondary:hover { background: var(--color-surface); border-color: var(--color-on-surface); }

    /* ספינר קטן בתוך כפתור התקנה בזמן המתנה לתוצאה */
    .btn-spinner {
      display: inline-block;
      width: 11px; height: 11px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -1px;
      margin-inline-end: 6px;
    }

    /* ── מצבים ── */
    #loading, #error, #empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 60px 20px; gap: 12px; text-align: center;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--color-outline);
      border-top-color: var(--color-on-surface);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    #error .icon { font-size: var(--fs-40); }
    #error p { color: var(--color-error); font-size: var(--fs-14); }
    .hidden { display: none !important; }

    /* ── מודל עדכונים ── */
    #updates-backdrop {
      position: fixed;
      inset: 0;
      background: var(--color-scrim);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #updates-modal {
      background: var(--color-surface-card);
      border-radius: var(--radius-18);
      border: 1px solid var(--color-outline);
      width: 100%;
      max-width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 48px var(--color-shadow-modal);
    }
    .modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--color-divider);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .modal-header-icon { font-size: var(--fs-22); }
    .modal-header h2 { font-size: var(--fs-16); font-weight: 700; flex: 1; }
    .modal-close {
      background: none; border: none; cursor: pointer;
      font-size: var(--fs-18); color: var(--color-text-faint); line-height: 1;
      padding: 4px; border-radius: var(--radius-6); transition: color .15s;
    }
    .modal-close:hover { color: var(--color-on-surface); }
    .modal-body {  flex: 1; padding: 12px 0; }
    .update-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      border-bottom: 1px solid var(--color-surface-muted);
    }
    .update-row:last-child { border-bottom: none; }
    .update-info { flex: 1; min-width: 0; }
    .update-name { font-size: var(--fs-14); font-weight: 700; color: var(--color-on-surface); }
    .update-versions { font-size: var(--fs-12); color: var(--color-text-faint); margin-top: 2px; }
    .update-btn {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: var(--radius-20);
      font-size: var(--fs-12);
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--color-accent);
      color: var(--color-on-accent);
      transition: background .15s;
      white-space: nowrap;
    }
    .update-btn:hover { background: var(--color-primary-hover); }
    .update-btn:disabled { opacity: .6; cursor: default; }
    .modal-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--color-divider);
      display: flex;
      justify-content: flex-end;
    }
    .update-all-btn {
      padding: 8px 20px;
      border-radius: var(--radius-20);
      font-size: var(--fs-13);
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--color-accent);
      color: var(--color-on-accent);
      transition: background .15s;
    }
    .update-all-btn:hover { background: var(--color-primary-hover); }
    .update-all-btn:disabled { opacity: .6; cursor: default; }

    /* ── דף פרטי תוסף ── */
    #detail-page {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text);
      font-size: var(--fs-14);
      font-weight: 600;
      padding: 6px 0;
      margin-bottom: 16px;
      transition: color .15s;
    }
    .back-btn:hover { color: var(--color-on-surface); }
    .back-arrow { font-size: var(--fs-18); line-height: 1; }

    .detail-header {
      background: var(--color-surface-card);
      border-radius: var(--radius-16);
      border: 1px solid var(--color-outline);
      padding: 24px;
      margin-bottom: 16px;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 600px) {
      .detail-header { grid-template-columns: 1fr; }
    }

    .detail-main-img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      border-radius: var(--radius-12);
      background: var(--color-surface-card);
    }
    .detail-main-img.is-default { object-fit: contain; padding: 24px; }
    .detail-main-img-placeholder {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, var(--color-placeholder), var(--color-outline));
      border-radius: var(--radius-12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--fs-48);
      color: var(--color-icon-faint);
    }

    .detail-info { display: flex; flex-direction: column; gap: 12px; }
    .detail-name { font-size: var(--fs-24); font-weight: 800; color: var(--color-on-surface); line-height: 1.3; }
    .detail-desc { font-size: var(--fs-14); color: var(--color-text); line-height: 1.7; white-space: pre-wrap; }
    .detail-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .detail-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .detail-install-btn {
      padding: 10px 24px;
      border-radius: var(--radius-24);
      font-size: var(--fs-14);
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--color-accent);
      color: var(--color-on-accent);
      transition: background .15s;
    }
    .detail-install-btn:hover { background: var(--color-primary-hover); }
    .detail-install-btn:disabled { opacity: .6; cursor: default; }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    @media (max-width: 500px) { .detail-grid { grid-template-columns: 1fr; } }

    .detail-card {
      background: var(--color-surface-card);
      border-radius: var(--radius-14);
      border: 1px solid var(--color-outline);
      padding: 18px;
    }
    .detail-card h2 {
      font-size: var(--fs-15);
      font-weight: 700;
      color: var(--color-on-surface);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .detail-card h2 .icon { font-size: var(--fs-18); }

    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-cell {
      background: var(--color-surface-soft);
      border-radius: var(--radius-10);
      padding: 10px 12px;
    }
    .info-cell.full { grid-column: 1 / -1; }
    .info-label { font-size: var(--fs-11); color: var(--color-text-faint); margin-bottom: 3px; }
    .info-value { font-size: var(--fs-13); font-weight: 700; color: var(--color-on-surface); }

    .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .detail-tag {
      padding: 4px 14px;
      border-radius: var(--radius-20);
      font-size: var(--fs-12);
      font-weight: 500;
      background: var(--color-surface-muted);
      color: var(--color-text-muted);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
    }
    .detail-tag:hover { border-color: var(--color-on-surface); color: var(--color-on-surface); }

    .screenshots-section {
      background: var(--color-surface-card);
      border-radius: var(--radius-14);
      border: 1px solid var(--color-outline);
      padding: 18px;
      margin-bottom: 16px;
    }
    .screenshots-section h2 {
      font-size: var(--fs-15);
      font-weight: 700;
      color: var(--color-on-surface);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .screenshots-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scroll-snap-type: x mandatory;
    }
    .screenshots-row::-webkit-scrollbar { height: 6px; }
    .screenshots-row::-webkit-scrollbar-thumb { background: var(--color-outline-strong); border-radius: var(--radius-3); }
    .screenshot-thumb {
      flex-shrink: 0;
      width: 220px;
      aspect-ratio: 16/11;
      object-fit: cover;
      border-radius: var(--radius-10);
      border: 1px solid var(--color-outline);
      cursor: pointer;
      scroll-snap-align: start;
      transition: transform .15s;
    }
    .screenshot-thumb:hover { transform: scale(1.02); }

    /* ── lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: var(--color-scrim-dark);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: var(--radius-10);
      object-fit: contain;
    }
    #lightbox-close {
      position: absolute;
      top: 16px;
      inset-inline-end: 16px;
      background: var(--color-overlay-light);
      border: none;
      color: var(--color-on-scrim);
      font-size: var(--fs-24);
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    #lightbox-close:hover { background: var(--color-overlay-light-hover); }

    /* ── הודעת תוסף חדש ── */
    #new-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--color-accent);
      color: var(--color-on-accent);
      border-radius: var(--radius-14);
      padding: 12px;
      padding-inline: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px var(--color-shadow-toast);
      z-index: 80;
      max-width: calc(100% - 40px);
      animation: toast-in .3s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 24px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    #new-toast .toast-icon { display: flex; flex-shrink: 0; }
    #new-toast .toast-text { font-size: var(--fs-14); font-weight: 700; flex: 1; white-space: nowrap; }
    #new-toast .toast-view {
      flex-shrink: 0;
      padding: 6px 18px;
      border-radius: var(--radius-20);
      font-size: var(--fs-13);
      font-weight: 700;
      cursor: pointer;
      border: none;
      background: var(--color-surface-card);
      color: var(--color-on-surface);
      transition: background .15s;
    }
    #new-toast .toast-view:hover { background: var(--color-surface-muted); }
    #new-toast .toast-close {
      background: none; border: none; cursor: pointer;
      font-size: var(--fs-16); color: var(--color-icon-faint); line-height: 1;
      padding: 4px; transition: color .15s;
    }
    #new-toast .toast-close:hover { color: var(--color-on-accent); }

    /* ── סרגל קטגוריות ── */
    #cats-bar {
      background: var(--color-surface-card);
      border-bottom: 1px solid var(--color-outline);
      padding: 10px 20px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    #cats-bar::-webkit-scrollbar { height: 6px; }
    #cats-bar::-webkit-scrollbar-thumb { background: var(--color-outline-strong); border-radius: var(--radius-3); }
    .cat-chip {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-20);
      font-size: var(--fs-13);
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--color-outline-strong);
      background: var(--color-surface-soft);
      color: var(--color-text);
      transition: background-color .15s, color .15s, border-color .15s;
      white-space: nowrap;
    }
    .cat-chip:hover { border-color: var(--color-on-surface); color: var(--color-on-surface); }
    .cat-chip.active { background: var(--color-accent); color: var(--color-on-accent); border-color: var(--color-accent); }
    .cat-chip .chip-count { font-size: var(--fs-11); opacity: .75; }
    /* "כל התוספים" — מוצא אחרון מוצנע בסוף השורה */
    .cat-chip.all-chip { border-style: dashed; background: none; color: var(--color-text-faint); }
    .cat-chip.all-chip:hover { color: var(--color-on-surface); }

    /* ── דף הבית האצור ── */
    #home { padding: 20px; display: flex; flex-direction: column; gap: 28px; }
    .home-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .home-section-title { font-size: var(--fs-18); font-weight: 800; color: var(--color-on-surface); }
    .home-section-desc { font-size: var(--fs-13); color: var(--color-text-muted); margin-top: 2px; }
    .home-see-all {
      background: none; border: none; cursor: pointer;
      color: var(--color-text); font-size: var(--fs-13); font-weight: 700;
      white-space: nowrap; padding: 4px 0; transition: color .15s;
    }
    .home-see-all:hover { color: var(--color-on-surface); text-decoration: underline; }
    .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .home-row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
    .home-row::-webkit-scrollbar { height: 6px; }
    .home-row::-webkit-scrollbar-thumb { background: var(--color-outline-strong); border-radius: var(--radius-3); }
    .home-row .card { width: 280px; flex-shrink: 0; scroll-snap-align: start; }
    .home-footer-strip {
      text-align: center;
      padding: 12px 0 4px;
      border-top: 1px dashed var(--color-outline-strong);
      font-size: var(--fs-13);
      color: var(--color-text-muted);
    }
    .home-footer-strip button {
      background: none; border: none; cursor: pointer;
      color: var(--color-text); font-weight: 700; font-size: var(--fs-13);
      text-decoration: underline; transition: color .15s;
    }
    .home-footer-strip button:hover { color: var(--color-on-surface); }

    /* ── כותרת תצוגה (קטגוריה / תוצאות חיפוש) ── */
    #view-title { padding: 16px 20px 0; }
    #view-title h2 { font-size: var(--fs-18); font-weight: 800; color: var(--color-on-surface); }
    #view-title p { font-size: var(--fs-13); color: var(--color-text-muted); margin-top: 4px; }
  </style>
</head>
<body>

<div class="app-shell">
<header class="topbar">
  <h1 data-t="חנות תוספים">חנות תוספים</h1>
  <span id="plugin-count"></span>
  <button id="refresh-btn" data-t-title="רענן רשימה" title="רענן רשימה"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
</header>

<div id="filters">
  <input id="search" type="search" data-t-placeholder="חיפוש לפי שם, תיאור או תגית..." placeholder="חיפוש לפי שם, תיאור או תגית...">
  <select id="status-filter">
    <option value="all" data-t="כל הסטטוסים">כל הסטטוסים</option>

</main>

<div id="updates-backdrop" class="hidden">
  <div id="updates-modal">
    <div class="modal-header">
      <span class="modal-header-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg></span>
      <h2 id="updates-title"></h2>

    </div>

  <button id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>

<div id="new-toast" class="hidden">
  <span class="toast-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4L12 3z"/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14z"/></svg></span>
  <span class="toast-text" id="new-toast-text"></span>
  <button class="toast-view" id="new-toast-view" data-t="צפה">צפה</button>
  <button class="toast-close" id="new-toast-close" data-t-title="סגור" title="סגור">✕</button>

<script>
  const BASE = 'https://otzaria.org';
  const API = BASE + '/api/plugins';
  // תמונת ברירת מחדל לתוסף ללא תמונה. נטענת ישירות מ-otzaria.org (כבר ב-allowlist),
  // לא נארזת בחבילה — הקובץ ~2MB והחנות ממילא דורשת רשת.
  // תמונת ברירת מחדל לתוסף בלי תמונה. logo.webp — הלוגו שהאתר עצמו מגיש
  // (logo.svg אינו קיים בשרת ומחזיר 404).
  const DEFAULT_IMG = BASE + '/logo.webp';

  // ── רב-לשוניות ───────────────────────────────────────────────────
  // עברית היא שפת הבסיס: מפתחות התרגום הם מחרוזות המקור בעברית, ושפה שאין לה
  // מילון (window.TRANSLATIONS[lang]) נשארת בעברית מאליה. השפה מגיעה מ-
  // payload.app של plugin.boot (או app.getLocale), ומתעדכנת חי דרך
  // settings.changed עם המפתח key-settings-language.
  let dict = null;                 // המילון הפעיל, או null לעברית
  let numLocale = 'he-IL';         // עיצוב מספרים ותאריכים
  let sortLocale = 'he';           // מיון תגיות

  function t(s, vars) {
    let out = (dict && dict[s]) || s;
    if (vars) for (const k in vars) out = out.split('{' + k + '}').join(vars[k]);
    return out;
  }

  // טקסט סטטי ב-HTML מסומן ב-data-t / data-t-title / data-t-placeholder,
  // כשהערך הוא מחרוזת המקור בעברית — כך אפשר לתרגם שוב בכל החלפת שפה.
  function translateStatic() {
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
    document.querySelectorAll('[data-t-placeholder]').forEach(el => { el.placeholder = t(el.dataset.tPlaceholder); });
    document.title = t('חנות תוספים');
  }

  function setLanguage(language, locale, textDirection) {
    const lang = language || 'he';
    dict = (window.TRANSLATIONS && window.TRANSLATIONS[lang]) || null;
    const dir = textDirection || (lang === 'he' ? 'rtl' : 'ltr');
    // ה-HTML הסטטי נשאר dir="rtl"; הכיוון האמיתי נקבע כאן בזמן ריצה
    document.documentElement.dir = dir;
    document.documentElement.lang = lang;
    numLocale = locale || (lang === 'he' ? 'he-IL' : 'en-US');
    sortLocale = lang;
    translateStatic();
    // אם הקטלוג כבר נטען — מרעננים את התצוגה כדי שהטקסט הדינמי יתורגם גם הוא
    if (allPlugins.length) { initTags(); initCatsBar(); renderCurrentView(); }
  }

  let allPlugins = [];
  let installedPlugins = [];   // [{ name, version }]
  let installedVersionByName = new Map();   // שם → גרסה מותקנת
  let activeTag = 'all';
  let appVersion = null;       // גרסת אוצריא המותקנת, לסינון תאימות

  // ── מצב תצוגה (אצירה) ──
  // storeHome — תשובת /api/plugins/store-home (null אם נכשלה: נופלים ל"כל התוספים").
  // currentView — 'home' (דף בית אצור) | 'all' (הרשימה המלאה) | 'category' (slug+name).
  // searchQuery — חיפוש פעיל גובר על התצוגה ומציג תוצאות מהחיפוש החכם בשרת.
  let storeHome = null;
  let currentView = { type: 'home' };
  let searchQuery = '';
  let searchTimer = null;
  let searchSeq = 0;                 // מונע תוצאות חיפוש ישנות מלדרוס חדשות
  let categoryCache = new Map();     // slug → תשובת ה-API של הקטגוריה

  // סוויץ' "הסתר מותקנים" — הבחירה נשמרת בין הפעלות. localStorage לא תמיד
  // שורד סגירה של ה-webview, לכן שומרים גם דרך אחסון התוסף של ה-SDK
  // (הרשאות plugin.storage.read/write); localStorage נשאר כגיבוי מקומי מהיר.
  const HIDE_INSTALLED_KEY = 'otzaria_store_hide_installed';
  let hideInstalled = false;
  try { hideInstalled = localStorage.getItem(HIDE_INSTALLED_KEY) === '1'; } catch {}

  // storage.get/set — אחסון KV של התוסף (עטיפת { success, data }, זמין מ-0.9.89).
  async function persistentGet(key) {
    try {
      const res = await Otzaria.call('storage.get', { key });
      return (res && res.success) ? res.data : null;
    } catch { return null; }
  }
  async function persistentSet(key, value) {
    try { await Otzaria.call('storage.set', { key, value }); } catch {}
  }

  const STATUS_KEYS = { stable: 'יציב', beta: 'בטא', experimental: 'ניסיוני' };
  const statusLabel = s => (STATUS_KEYS[s] ? t(STATUS_KEYS[s]) : null);
  const statusClass = { stable: 'badge-stable', beta: 'badge-beta', experimental: 'badge-experimental' };

  // ── עדכונים ─────────────────────────────────────────────────────
  // השוואת גרסאות SemVer: מחזיר 1 אם a>b, -1 אם a<b, 0 אם שוות.
  function compareVersions(a, b) {
    const parse = v => String(v ?? '').split('.').map(n => parseInt(n, 10) || 0);
    const pa = parse(a), pb = parse(b);
    const len = Math.max(pa.length, pb.length);
    for (let i = 0; i < len; i++) {
      const d = (pa[i] || 0) - (pb[i] || 0);
      if (d !== 0) return d > 0 ? 1 : -1;
    }
    return 0;
  }

  // ── בחירת הגרסה התואמת ─────────────────────────────────────────────
  // עובד בשני רבדים: כל קריאה ל-API נשלחת עם appVersion (ראו withAppVersion),
  // והשרת מחזיר כבר את הגרסה התואמת ומשמיט תוספים ללא גרסה תואמת; ובנוסף אותה
  // בחירה מתבצעת גם כאן על התשובה. הכפילות מכוונת: מול אתר ותיק שאינו מכיר את
  // הפרמטר החנות ממשיכה לעבוד נכון, והחישוב זהה ולכן אין סתירה בין השניים.
  //
  // גרסה (חיה או היסטורית) תואמת רק אם גרסת אוצריא בטווח [compatibleWith, maxAppVersion].
  // כשגרסת אוצריא אינה ידועה (כשל ב-app.getInfo) — לא מסתירים דבר.
  function isVersionCompatible(v, appVer) {
    if (!appVer) return true;
    if (v.compatibleWith && compareVersions(appVer, v.compatibleWith) < 0) return false;
    if (v.maxAppVersion && compareVersions(appVer, v.maxAppVersion) > 0) return false;
    return true;
  }

  // כל הגרסאות הזמינות לתוסף. ב-API החדש מגיע שדה versions (החיה + ההיסטוריה);
  // אם הוא חסר (API ישן) נופלים חזרה לגרסה החיה היחידה מהשדות העליונים.
  function pluginVersionCandidates(p) {
    if (Array.isArray(p.versions) && p.versions.length) return p.versions;
    return [{
      version: p.version,
      status: p.status,
      compatibleWith: p.compatibleWith,
      maxAppVersion: p.maxAppVersion,
      requiresNetwork: p.requiresNetwork,
      pluginFileSize: p.pluginFileSize,
      downloadUrl: p.downloadUrl,
      isLatest: true,
    }];
  }

  // הגרסה הגבוהה ביותר התואמת לגרסת אוצריא — null אם אין אף גרסה תואמת.
  function selectBestVersion(p, appVer) {
    return pluginVersionCandidates(p)
      .filter(v => isVersionCompatible(v, appVer))
      .sort((a, b) => compareVersions(b.version, a.version))[0] || null;
  }

  // מוסיף את גרסת אוצריא לכל קריאה ל-API של החנות. השרת מחזיר אז כל תוסף בגרסה
  // התואמת הגבוהה ביותר, משמיט תוספים ללא גרסה תואמת, ומתקן בהתאם גם את המונים
  // (pluginCount / totalPublicPlugins / total בחיפוש ובקטגוריה) והעימוד — דבר
  // שסינון מקומי אחרי הבקשה אינו יכול לעשות. אתר ותיק שאינו מכיר את הפרמטר
  // מתעלם ממנו, והסינון המקומי כאן מטפל בכל מקרה.
  function withAppVersion(url) {
    if (!appVersion) return url;
    return url + (url.includes('?') ? '&' : '?') + 'appVersion=' + encodeURIComponent(appVersion);
  }

  // הגרסה הגבוהה ביותר בכלל (ללא תלות בתאימות) — לזיהוי "קיימת גרסה חדשה יותר".
  function latestVersionOf(p) {
    return pluginVersionCandidates(p)
      .slice()
      .sort((a, b) => compareVersions(b.version, a.version))[0] || null;
  }

  // ממפה תוסף מהקטלוג ל"תוסף אפקטיבי" שגרסתו וקישור-ההורדה שלו הם הגרסה התואמת
  // הגבוהה ביותר (לא בהכרח האחרונה). מחזיר null אם אין אף גרסה תואמת — אז התוסף
  // לא יוצג ולא ייחשב לעדכון.
  function toEffectivePlugin(p) {
    const best = selectBestVersion(p, appVersion);
    if (!best) return null;
    const latest = latestVersionOf(p);
    return {
      ...p,
      version: best.version,
      status: best.status || p.status,
      compatibleWith: best.compatibleWith,
      maxAppVersion: best.maxAppVersion,
      requiresNetwork: best.requiresNetwork ?? p.requiresNetwork,
      // גודל הקובץ של הגרסה המוצגת. קיים ב-versions של ה-API הנוכחי; ה-fallback
      // לשדה העליון (API עתידי) ול-0 שומר תאימות מלאה ל-API ישן שאין בו גודל כלל.
      pluginFileSize: best.pluginFileSize ?? p.pluginFileSize ?? 0,
      downloadUrl: best.downloadUrl || p.downloadUrl,
      // קיימת גרסה חדשה יותר שאינה תואמת לגרסת אוצריא הנוכחית של המשתמש
      newerIncompatibleVersion: latest && compareVersions(latest.version, best.version) > 0
        ? latest.version : null,
    };
  }

  function getAvailableUpdates() {
    return installedPlugins.flatMap(inst => {
      // מציגים עדכון רק אם הגרסה בחנות גבוהה מהמותקנת — לא אם המותקנת גבוהה יותר.
      const newer = allPlugins.find(p => p.name === inst.name && compareVersions(p.version, inst.version) > 0);
      return newer ? [{ installed: inst, plugin: newer }] : [];
    });
  }

  function showUpdatesModal(updates) {
    document.getElementById('updates-title').textContent =
      t('עדכונים זמינים ({n})', { n: updates.length });

    const list = document.getElementById('updates-list');
    list.innerHTML = '';
    updates.forEach(({ installed, plugin }) => {
      const downloadUrl = plugin.downloadUrl.startsWith('http')
        ? plugin.downloadUrl : BASE + plugin.downloadUrl;
      const row = document.createElement('div');
      row.className = 'update-row';
      row.innerHTML = `
        <div class="update-info">
          <div class="update-name">${esc(plugin.name)}</div>
          <div class="update-versions">${esc(t('{from} ← {to}', { from: installed.version, to: plugin.version }))}</div>
        </div>
        <button class="update-btn" data-url="${esc(downloadUrl)}" data-update="1">${esc(t('עדכן'))}</button>`;
      list.appendChild(row);
    });

    // שורה שהעדכון בה הצליח יורדת מהרשימה; כשהרשימה מתרוקנת החלונית נסגרת,
    // כדי שלא תישאר פתוחה עם רשימה שכבר אינה רלוונטית.
    function settleRow(row, result) {
      if (result !== 'success') return;
      setTimeout(() => {
        row.remove();
        if (!list.querySelector('.update-row')) hide('updates-backdrop');
        else document.getElementById('updates-title').textContent =
          t('עדכונים זמינים ({n})', { n: list.querySelectorAll('.update-row').length });
      }, 900);
    }

    list.querySelectorAll('.update-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const result = await installPluginTracked(btn, btn.dataset.url, true);
        settleRow(btn.closest('.update-row'), result);
      });
    });

    const updateAllBtn = document.getElementById('update-all-btn');
    updateAllBtn.disabled = false;
    updateAllBtn.textContent = t('עדכן הכל');
    updateAllBtn.onclick = async () => {
      updateAllBtn.disabled = true;
      updateAllBtn.textContent = t('מעדכן...');
      const btns = [...list.querySelectorAll('.update-btn:not(:disabled)')];
      const results = [];
      for (const btn of btns) {
        const result = await installPluginTracked(btn, btn.dataset.url, true);
        results.push(result);
        settleRow(btn.closest('.update-row'), result);   // מוריד מהרשימה מה שהצליח
      }
      updateAllBtn.textContent = t('הושלם ✓');
      // כל העדכונים הצליחו — סוגרים את החלונית אחרי רגע קצר של משוב.
      // אם משהו נכשל/לא דווח, משאירים פתוח כדי שיהיה אפשר לנסות שוב.
      if (results.length && results.every(r => r === 'success')) {
        setTimeout(() => hide('updates-backdrop'), 900);
      } else if (results.some(r => r !== 'success')) {
        updateAllBtn.disabled = false;
        updateAllBtn.textContent = t('נסה שוב את מה שנכשל');
      }
    };

    show('updates-backdrop');
  }

  document.getElementById('updates-close').onclick = () => hide('updates-backdrop');
  document.getElementById('updates-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) hide('updates-backdrop');
  });

  // ── תוספים חדשים בחנות ──────────────────────────────────────────
  // מפתח v2: הזהות נשמרת לפי id היציב (ולא לפי השם שעלול להשתנות).
  // החלפת המפתח מהגרסה הישנה (שמות) גורמת לטעינה הראשונה רק לשמור, בלי הודעה.
  const KNOWN_KEY = 'otzaria_store_known_plugins_v2';

  function checkNewPlugins() {
    let known = null;
    try { known = JSON.parse(localStorage.getItem(KNOWN_KEY)); } catch {}

    const currentIds = allPlugins.map(p => p.id);
    try { localStorage.setItem(KNOWN_KEY, JSON.stringify(currentIds)); } catch {}

    // בטעינה הראשונה (אין נתון קודם) רק שומרים, בלי הודעה
    if (!Array.isArray(known)) return;

    const knownSet = new Set(known);
    // תוסף שכבר מותקן אצל המשתמש אינו "חדש בחנות", גם אם נכנס לקטלוג עכשיו
    const installedNames = new Set(installedPlugins.map(p => p.name));
    const newPlugins = allPlugins.filter(p =>
      !knownSet.has(p.id) && !installedNames.has(p.name));
    if (newPlugins.length > 0) showNewToast(newPlugins);
  }

  function showNewToast(newPlugins) {
    // תור התוספים החדשים שעוד לא נצפו
    let pending = newPlugins.slice();

    function update() {
      if (pending.length === 0) { hide('new-toast'); return; }
      document.getElementById('new-toast-text').textContent = pending.length === 1
        ? t('תוסף חדש בחנות!')
        : t('{n} תוספים חדשים בחנות!', { n: pending.length });
      show('new-toast');
    }

    document.getElementById('new-toast-view').onclick = () => {
      const next = pending.shift();   // מסירים את הראשון מהתור
      update();                       // ההודעה נשארת עם השאר שעוד לא נצפו
      showDetail(next);
    };

    update();
  }

  document.getElementById('new-toast-close').onclick = () => hide('new-toast');

  // ── רענון ────────────────────────────────────────────────────────
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.addEventListener('click', () => {
    if (refreshBtn.classList.contains('spinning')) return;
    reload();
  });

  async function reload() {
    refreshBtn.classList.add('spinning');
    hide('grid'); hide('empty'); hide('error'); hide('home'); hide('view-title');
    show('loading');
    allPlugins = [];
    installedPlugins = [];
    installedVersionByName = new Map();
    try {
      const [fetchRes, installedRes, homeRes] = await Promise.all([
        Otzaria.call('network.fetch', { url: withAppVersion(API) }),
        Otzaria.call('plugin.listInstalled', {}),
        // דף הבית האצור — כשל בו אינו מפיל את החנות (נופלים ל"כל התוספים")
        Otzaria.call('network.fetch', { url: withAppVersion(BASE + '/api/plugins/store-home') }).catch(() => null),
      ]);
      if (!fetchRes.success) throw new Error(fetchRes.error?.message || t('שגיאת רשת'));
      if (fetchRes.data.status !== 200) throw new Error(`HTTP ${fetchRes.data.status}`);
      const rawCatalog = JSON.parse(fetchRes.data.body);
      // לכל תוסף בוחרים את הגרסה הגבוהה ביותר התואמת לגרסת אוצריא של המשתמש
      // (לא בהכרח האחרונה). תוסף שאין לו אף גרסה תואמת — מוסר מהרשימה. כך
      // המשתמש רואה ומתעדכן לגרסה התומכת גם אם הגרסה האחרונה אינה תואמת אצלו.
      allPlugins = rawCatalog.map(toEffectivePlugin).filter(Boolean);
      if (installedRes.success) {
        installedPlugins = installedRes.data;
        installedPlugins.forEach(p => installedVersionByName.set(p.name, p.version));
      }
      storeHome = null;
      if (homeRes && homeRes.success && homeRes.data.status === 200) {
        try { storeHome = JSON.parse(homeRes.data.body); } catch { /* נופלים ל"כל התוספים" */ }
      }
      categoryCache = new Map();
      // אצירה ריקה או כשל בטעינתה → ברירת המחדל היא הרשימה המלאה
      if (currentView.type === 'home' && !hasCuratedHome()) currentView = { type: 'all' };
      initTags();
      initCatsBar();
      renderCurrentView();
      hide('new-toast');
      checkNewPlugins();
      const updates = getAvailableUpdates();
      if (updates.length > 0) showUpdatesModal(updates);
    } catch (e) {
      document.getElementById('error-msg').textContent = t('שגיאה בטעינת התוספים: {msg}', { msg: e.message });
      show('error');
    }
    hide('loading');
    refreshBtn.classList.remove('spinning');
  }

  // ── ערכת צבעים: מושכים כמה שיותר צבעים מ-theme האמיתי של אוצריא ──────
  //    (רקע, טקסט, מסגרות, הדגשה, שגיאה). הפלטה החמה ב-:root היא רק ברירת
  //    מחדל אם theme לא נמסר. צבעי סטטוס/צללים נשארים מקומיים (אין להם תפקיד
  //    מתאים ב-Material של אוצריא) — ראה body.dark-mode.
  function darken(hex, amt) {
    const m = /^#?([0-9a-fA-F]{6})$/.exec(hex && hex.trim());
    if (!m) return hex;
    const n = parseInt(m[1], 16);
    const r = Math.round(((n >> 16) & 255) * (1 - amt));
    const g = Math.round(((n >> 8) & 255) * (1 - amt));
    const b = Math.round((n & 255) * (1 - amt));
    return '#' + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
  }

  function applyTheme(theme) {
    if (!theme) return;
    document.body.classList.toggle('dark-mode', theme.mode === 'dark');
    const cs = theme.colorScheme;
    if (!cs) return;
    const root = document.documentElement;
    const set = (k, v) => { if (v) root.style.setProperty(k, v); };

    const high = cs.surfaceContainerHigh || cs.surface;            // רקע הסרגל העליון של אוצריא
    const pageBg = cs.surfaceContainer || high;                    // שכבת רקע עדינה מתחת לפס
    const onVar = cs.onSurfaceVariant || cs.onSurface;             // טקסט משני
    const outlineSoft = cs.outlineVariant || cs.outline;          // מסגרת עדינה

    // רקעים
    set('--color-surface', pageBg);                               // רקע כללי של הדף
    set('--color-surface-card', cs.surface);                      // כרטיסים/כותרת/חלוניות
    set('--color-surface-soft', pageBg);                          // שדות קלט, סרגל תגיות
    set('--color-surface-muted', cs.surfaceContainerHighest);     // צ'יפים, badge גרסה
    set('--color-placeholder', cs.surfaceContainerHighest);       // רקע placeholder לתמונה
    // טקסט
    set('--color-on-surface', cs.onSurface);
    set('--color-text', onVar);
    set('--color-text-muted', onVar);
    set('--color-text-faint', onVar);
    set('--color-icon-faint', onVar);
    // מסגרות ומפרידים
    set('--color-outline', outlineSoft);
    set('--color-outline-strong', cs.outline);
    set('--color-divider', outlineSoft);
    // שגיאה
    set('--color-error', cs.error);
    // הדגשה — כפתורים ראשיים, תגית פעילה, טוסט
    set('--color-accent', cs.primary);
    set('--color-on-accent', cs.onPrimary);
    set('--color-primary-hover', darken(cs.primary, 0.12));
    // רקע פס הכותרת — אותו צבע כמו הסרגל העליון של מסכי הספרים באוצריא
    set('--color-surface-container-high', high);
  }

  // ה-theme והשפה מגיעים כבר ב-plugin.boot (ללא הרשאה); נתפוס אותם מוקדם ככל האפשר.
  try {
    Otzaria.on('plugin.boot', p => {
      if (p && p.theme) applyTheme(p.theme);
      if (p && p.app) setLanguage(p.app.language, p.app.locale, p.app.textDirection);
    });
    // עדכון חי כשהמשתמש מחליף ערכת צבעים/מצב כהה (הרשאה: events.subscribe:theme.changed)
    Otzaria.on('theme.changed', applyTheme);
    // עדכון חי כשהמשתמש מחליף את שפת הממשק (הרשאה: events.subscribe:settings.changed).
    // newValue הוא קוד השפה האפקטיבי ('he'/'en') גם כשהבחירה היא 'system'.
    Otzaria.on('settings.changed', e => {
      if (e && e.key === 'key-settings-language') setLanguage(e.newValue);
    });
  } catch {}

  // ── טעינה ראשונית ────────────────────────────────────────────────
  async function loadPlugins() {
    await new Promise(resolve => window.addEventListener('plugin.ready', resolve, { once: true }));
    // קריאה מפורשת כדי לוודא את המצב הנוכחי גם אם plugin.boot כבר חלף
    try {
      const res = await Otzaria.call('app.getTheme', {});
      if (res && res.success) applyTheme(res.data);
    } catch {}
    // כנ"ל לשפה — מוודא את שפת הממשק הנוכחית גם אם plugin.boot כבר חלף
    try {
      const loc = await Otzaria.call('app.getLocale', {});
      if (loc && loc.success) setLanguage(loc.data.language, loc.data.locale, loc.data.textDirection);
    } catch {}
    // גרסת אוצריא קבועה לאורך הריצה — מספיק למשוך פעם אחת לפני הטעינה
    try {
      const info = await Otzaria.call('app.getInfo', {});
      if (info && info.success) appVersion = info.data.version;
    } catch {}
    // שחזור "הסתר מותקנים" מאחסון התוסף (storage.get שורד בין פתיחות,
    // בניגוד ל-localStorage שמתאפס עם ה-webview) — לפני הרינדור הראשון.
    const saved = await persistentGet(HIDE_INSTALLED_KEY);
    if (saved !== null && saved !== undefined) {
      hideInstalled = saved === true || saved === '1';
      hideInstalledEl.checked = hideInstalled;
      try { localStorage.setItem(HIDE_INSTALLED_KEY, hideInstalled ? '1' : '0'); } catch {}
    }
    await reload();
  }

  // ── מנוע התצוגות: דף בית אצור / קטגוריה / כל התוספים / חיפוש ──────

  // "לא מותקן או שיש לו עדכון" — הבסיס לסוויץ' "הסתר מותקנים".
  function isVisibleInStore(p) {
    const inst = installedVersionByName.get(p.name);
    return inst === undefined || compareVersions(p.version, inst) > 0;
  }

  // מסנן אחיד לכל התצוגות: כשהסוויץ' דולק — מותקנים (ללא עדכון) מוסתרים;
  // כשכבוי — מוצגים עם כפתור במצב "מותקן ✓" / "עדכון".
  function applyInstalledFilter(list) {
    return hideInstalled ? list.filter(isVisibleInStore) : list;
  }

  // מצב ההתקנה של תוסף אצל המשתמש: 'not_installed' | 'update' | 'installed'
  function installStateOf(p) {
    const inst = installedVersionByName.get(p.name);
    if (inst === undefined) return 'not_installed';
    return compareVersions(p.version, inst) > 0 ? 'update' : 'installed';
  }

  // ממפה רשימת תוספים מה-API (נבחרים/קטגוריה/חיפוש) לעצמים מהקטלוג המקומי —
  // כך נשמרים סינון התאימות (toEffectivePlugin) והסדר, ומוחל סוויץ' "הסתר מותקנים".
  function toCatalogList(list) {
    const byId = new Map(allPlugins.map(p => [p.id, p]));
    return applyInstalledFilter((list || []).map(x => byId.get(x.id)).filter(Boolean));
  }

  // יש מה להציג בדף הבית האצור? (נבחרים או שורת קטגוריה עם תוכן בפועל)
  function hasCuratedHome() {
    if (!storeHome) return false;
    if (toCatalogList(storeHome.featured).length) return true;
    return (storeHome.categories || []).some(c => c.showOnHome && toCatalogList(c.plugins).length);
  }

  function clearSearch() {
    searchQuery = '';
    searchSeq++;
    clearTimeout(searchTimer);
    document.getElementById('search').value = '';
  }

  // ── סרגל הקטגוריות ──
  function makeCatChip(label, key, onClick) {
    const btn = document.createElement('button');
    btn.className = 'cat-chip';
    btn.dataset.key = key;
    btn.textContent = label;
    btn.onclick = onClick;
    return btn;
  }

  function initCatsBar() {
    const bar = document.getElementById('cats-bar');
    bar.innerHTML = '';
    const cats = storeHome ? (storeHome.categories || []) : [];
    if (!cats.length) { hide('cats-bar'); return; }

    if (hasCuratedHome()) {
      bar.appendChild(makeCatChip(t('בית'), 'home', () => {
        clearSearch();
        currentView = { type: 'home' };
        renderCurrentView();
      }));
    }
    cats.forEach(c => {
      const chip = makeCatChip(c.name, 'cat:' + c.slug, () => {
        clearSearch();
        currentView = { type: 'category', slug: c.slug, name: c.name };
        renderCurrentView();
      });
      const count = document.createElement('span');
      count.className = 'chip-count';
      count.textContent = `(${c.pluginCount})`;
      chip.appendChild(count);
      bar.appendChild(chip);
    });
    // "כל התוספים" — מוצא אחרון, מוצנע בסוף השורה
    const all = makeCatChip(t('כל התוספים ({n})', { n: storeHome.totalPublicPlugins || allPlugins.length }), 'all', () => {
      clearSearch();
      currentView = { type: 'all' };
      renderCurrentView();
    });
    all.classList.add('all-chip');
    bar.appendChild(all);
    show('cats-bar');
  }

  function updateCatsBarActive() {
    const key = searchQuery ? ''
      : currentView.type === 'home' ? 'home'
      : currentView.type === 'all' ? 'all'
      : 'cat:' + currentView.slug;
    document.querySelectorAll('.cat-chip').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  }

  // ── ניתוב תצוגה ──
  function renderCurrentView() {
    hide('detail-page');
    show('filters');
    document.getElementById('plugin-count').textContent = t('{n} תוספים', { n: allPlugins.length });
    if (storeHome && (storeHome.categories || []).length) show('cats-bar'); else hide('cats-bar');
    updateCatsBarActive();

    if (searchQuery) {
      hide('home'); hide('tags-wrap');
      renderSearch();
      return;
    }
    hide('view-title');
    if (currentView.type === 'home') {
      hide('tags-wrap'); hide('grid'); hide('empty');
      renderHome();
    } else if (currentView.type === 'category') {
      hide('tags-wrap'); hide('home');
      renderCategory();
    } else {
      hide('home');
      document.getElementById('tags-wrap').classList.remove('hidden');
      updateTagsToggle();
      render();
    }
  }

  function setViewTitle(title, sub) {
    const el = document.getElementById('view-title');
    if (!title) { hide('view-title'); return; }
    el.innerHTML = `<h2>${esc(title)}</h2>${sub ? `<p>${esc(sub)}</p>` : ''}`;
    show('view-title');
  }

  function fillGrid(list) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if (!list.length) { show('empty'); hide('grid'); return; }
    hide('empty'); show('grid');
    list.forEach(p => grid.appendChild(makeCard(p)));
  }

  // ── דף הבית האצור ──
  function renderHome() {
    const home = document.getElementById('home');
    home.innerHTML = '';

    const featured = toCatalogList(storeHome.featured);
    if (featured.length) {
      const sec = document.createElement('section');
      sec.innerHTML = `<div class="home-section-head"><div><div class="home-section-title">${esc(t('תוספים נבחרים'))}</div></div></div>`;
      const grid = document.createElement('div');
      grid.className = 'home-grid';
      featured.forEach(p => grid.appendChild(makeCard(p)));
      sec.appendChild(grid);
      home.appendChild(sec);
    }

    (storeHome.categories || []).filter(c => c.showOnHome).forEach(c => {
      const plugins = toCatalogList(c.plugins);
      if (!plugins.length) return;
      const sec = document.createElement('section');
      const head = document.createElement('div');
      head.className = 'home-section-head';
      head.innerHTML = `
        <div>
          <div class="home-section-title">${esc(c.name)}</div>
          ${c.description ? `<div class="home-section-desc">${esc(c.description)}</div>` : ''}
        </div>
        <button class="home-see-all">${esc(t('לכל הקטגוריה ({n}) ←', { n: c.pluginCount }))}</button>`;
      head.querySelector('.home-see-all').onclick = () => {
        currentView = { type: 'category', slug: c.slug, name: c.name };
        renderCurrentView();
      };
      const row = document.createElement('div');
      row.className = 'home-row';
      plugins.forEach(p => row.appendChild(makeCard(p)));
      sec.appendChild(head);
      sec.appendChild(row);
      home.appendChild(sec);
    });

    // פס גילוי מוצנע אל הרשימה המלאה
    const strip = document.createElement('div');
    strip.className = 'home-footer-strip';
    strip.innerHTML = `${esc(t('לא מצאתם את מה שחיפשתם? '))}<button>${esc(t('עיינו בכל התוספים ({n}) ←', { n: storeHome.totalPublicPlugins || allPlugins.length }))}</button>`;
    strip.querySelector('button').onclick = () => {
      currentView = { type: 'all' };
      renderCurrentView();
    };
    home.appendChild(strip);

    show('home');
  }

  // ── דף קטגוריה ──
  async function renderCategory() {
    const { slug, name } = currentView;
    setViewTitle(name || t('קטגוריה'), '');
    if (!categoryCache.has(slug)) {
      show('loading'); hide('grid'); hide('empty');
      try {
        const res = await apiFetch(withAppVersion(`${API}/categories/${encodeURIComponent(slug)}`));
        if (res.status !== 200) throw new Error(`HTTP ${res.status}`);
        categoryCache.set(slug, JSON.parse(res.body));
      } catch {
        hide('loading');
        setViewTitle(name || t('קטגוריה'), t('שגיאה בטעינת הקטגוריה — נסו לרענן'));
        fillGrid([]);
        return;
      }
      hide('loading');
      // בזמן הטעינה המשתמש אולי עבר לתצוגה אחרת
      if (searchQuery || currentView.type !== 'category' || currentView.slug !== slug) return;
    }
    const cat = categoryCache.get(slug);
    setViewTitle(cat.name, cat.description || '');
    fillGrid(toCatalogList(cat.plugins));
  }

  // ── חיפוש חכם מהשרת (עם fallback לסינון מקומי) ──
  async function renderSearch() {
    const q = searchQuery;
    const seq = ++searchSeq;
    hide('view-title'); hide('grid'); hide('empty');
    show('loading');

    let list = null;
    let relaxed = false;
    try {
      const status = document.getElementById('status-filter').value;
      const url = `${API}/search?q=${encodeURIComponent(q)}&limit=50${status !== 'all' ? `&status=${encodeURIComponent(status)}` : ''}`;
      const res = await apiFetch(withAppVersion(url));
      if (res.status === 200) {
        const data = JSON.parse(res.body);
        list = toCatalogList(data.results);
        relaxed = data.relaxed === true;
      }
    } catch { /* fallback לסינון מקומי */ }

    // תשובה ישנה או שהקלט השתנה בינתיים — נזרקת
    if (seq !== searchSeq || q !== searchQuery) return;
    hide('loading');

    if (list === null) {
      // fallback מקומי — אותה התנהגות כמו חיפוש השרת, כולל סוויץ' "הסתר מותקנים"
      const ql = q.toLowerCase();
      const status = document.getElementById('status-filter').value;
      list = applyInstalledFilter(allPlugins).filter(p => {
        if (status !== 'all' && p.status !== status) return false;
        const hay = [p.name, p.shortDescription, p.description, ...(p.tags || [])].join(' ').toLowerCase();
        return hay.includes(ql);
      });
    }

    setViewTitle(
      list.length ? t('נמצאו {n} תוצאות עבור „{q}"', { n: list.length, q }) : '',
      relaxed ? t('לא נמצאו התאמות מדויקות — מוצגות תוצאות קרובות') : ''
    );
    fillGrid(list);
  }

  // ── תגיות ────────────────────────────────────────────────────────
  function initTags() {
    const tagSet = new Set();
    allPlugins.forEach(p => (p.tags || []).forEach(tag => tagSet.add(tag)));
    const sorted = [...tagSet].sort((a, b) => a.localeCompare(b, sortLocale));

    const container = document.getElementById('tags');
    container.innerHTML = '';
    container.appendChild(makeTag(t('כל התגיות'), 'all', activeTag === 'all'));
    sorted.forEach(tag => container.appendChild(makeTag(tag, tag, activeTag === tag)));
    document.getElementById('tags-wrap').classList.remove('hidden');
    tagsExpanded = false;
    updateTagsToggle();
  }

  // הגבלת אזור התגיות ל-3 שורות עם לחצן "הצג עוד"
  let tagsExpanded = false;

  function updateTagsToggle() {
    const tags = document.getElementById('tags');
    const toggle = document.getElementById('tags-toggle');
    if (!tags.children.length || !tags.offsetParent) {
      toggle.classList.add('hidden');
      return;
    }

    const rowH = tags.children[0].offsetHeight;
    const gap = 6;
    const collapsedMax = rowH * 3 + gap * 2;

    if (tags.scrollHeight <= collapsedMax + 1) {
      toggle.classList.add('hidden');
      tags.classList.remove('collapsed');
      tags.style.maxHeight = '';
      return;
    }

    toggle.classList.remove('hidden');
    if (tagsExpanded) {
      tags.classList.remove('collapsed');
      tags.style.maxHeight = '';
      toggle.textContent = t('הצג פחות');
    } else {
      tags.classList.add('collapsed');
      tags.style.maxHeight = collapsedMax + 'px';
      toggle.textContent = t('הצג עוד');
    }
  }

  document.getElementById('tags-toggle').addEventListener('click', () => {
    tagsExpanded = !tagsExpanded;
    updateTagsToggle();
  });

  let tagsResizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(tagsResizeTimer);
    tagsResizeTimer = setTimeout(updateTagsToggle, 150);
  });

  function makeTag(label, value, active) {
    const btn = document.createElement('button');
    btn.className = 'tag-btn' + (active ? ' active' : '');
    btn.textContent = label;
    btn.dataset.value = value;
    btn.onclick = () => {
      activeTag = value;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    return btn;
  }

  // ── רינדור "כל התוספים" (הרשימה המלאה עם סינון תגית/סטטוס) ────────
  // חיפוש טקסט אינו מטופל כאן — searchQuery פעיל מנותב ל-renderSearch (חיפוש שרת).
  function render() {
    const status = document.getElementById('status-filter').value;

    const list = applyInstalledFilter(allPlugins).filter(p => {
      if (status !== 'all' && p.status !== status) return false;
      if (activeTag !== 'all' && !(p.tags || []).includes(activeTag)) return false;
      return true;
    });

    const countEl = document.getElementById('plugin-count');
    countEl.textContent = list.length === allPlugins.length
      ? t('{n} תוספים', { n: allPlugins.length })
      : t('{n} מתוך {total}', { n: list.length, total: allPlugins.length });

    fillGrid(list);
  }

  function makeCard(p) {
    const art = document.createElement('article');
    art.className = 'card';

    const downloadUrl = p.downloadUrl.startsWith('http') ? p.downloadUrl : BASE + p.downloadUrl;
    const hasImg = !!p.image;
    const imgUrl = hasImg ? (p.image.startsWith('http') ? p.image : BASE + p.image) : DEFAULT_IMG;

    art.innerHTML = `
      <img class="card-img${hasImg ? '' : ' is-default'}" src="${esc(imgUrl)}" alt="${esc(p.name)}" loading="lazy">
      <div class="card-body">
        <div class="card-badges">
          <span class="badge ${statusClass[p.status] || ''}">${esc(statusLabel(p.status) || p.status)}</span>
          <span class="badge badge-version">${esc(t('גרסה {v}', { v: p.version }))}</span>
          ${downloadsBadge(p)}
          ${ratingBadge(p)}
        </div>
        <div class="card-title">${esc(p.name)}</div>
        <div class="card-desc">${esc(p.shortDescription || '')}</div>
        ${(p.tags || []).length > 0
          ? `<div class="card-tags">${p.tags.slice(0,4).map(tag => `<span class="card-tag">${esc(tag)}</span>`).join('')}</div>`
          : ''}
        <div class="card-actions">
          ${installButtonHtml(p, downloadUrl, 'btn btn-primary install-btn')}
        </div>
      </div>`;

    art.addEventListener('click', (e) => {
      if (e.target.closest('.install-btn')) return;
      showDetail(p);
    });

    return art;
  }

  // ── דף פרטים ────────────────────────────────────────────────────
  function showDetailPage() {
    hide('filters'); hide('cats-bar'); hide('tags-wrap'); hide('home'); hide('view-title');
    hide('grid'); hide('empty'); hide('loading'); hide('error');
    document.getElementById('plugin-count').textContent = '';

    scrollContentTop();

  // הגלילה חיה ב-.app-content (פס הכותרת קבוע) — מעבר בין תצוגות מחזיר אותה לראש
  function scrollContentTop() {
    const c = document.getElementById('app-content');
    if (c) c.scrollTop = 0;

    scrollContentTop();

  // כפתור התקנה לפי מצב: מותקן ועדכני → "מותקן ✓" מנוטרל; מותקן עם גרסה
  // חדשה בחנות → "עדכון"; לא מותקן → "התקנה".
  function installButtonHtml(p, downloadUrl, className) {
    const state = installStateOf(p);
    if (state === 'installed') {
      return `<button class="${className}" disabled>${esc(t('מותקן ✓'))}</button>`;
    }
    const label = state === 'update' ? t('עדכון') : t('התקנה');
    return `<button class="${className}" data-url="${esc(downloadUrl)}"${state === 'update' ? ' data-update="1"' : ''}>${esc(label)}</button>`;
  }

  // ── כלים ─────────────────────────────────────────────────────────
  // אייקון הורדה (feather download)
  const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
  // כוכב מלא (feather star) — צבוע ב-currentColor, לשתי שכבות המילוי
  const STAR_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';
  // כוכב קווי לכותרת לוח הדירוגים (באותו סגנון כמו שאר כותרות הכרטיסים)
  const STAR_OUTLINE_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

  function fmtNum(n) {
    return (Number(n) || 0).toLocaleString(numLocale);
  }

  // גודל קובץ בתצוגה ידידותית (B/KB/MB)
  function fmtSize(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toLocaleString(numLocale, { maximumFractionDigits: 0 })} KB`;
    return `${(n / (1024 * 1024)).toLocaleString(numLocale, { maximumFractionDigits: 1 })} MB`;
  }

  // תגית כמות הורדות. מוצגת תמיד (גם 0), כדי לשמור על מראה אחיד עם האתר.
  function downloadsBadge(p) {
    return `<span class="badge badge-downloads" title="${esc(t('כמות הורדות'))}">${DOWNLOAD_ICON}${esc(t('{n} הורדות', { n: fmtNum(p.downloadCount) }))}</span>`;
  }

  // ── דירוגים (תצוגה בלבד) ─────────────────────────────────────────
  // הדירוג נאסף באתר החנות בלבד — אין באוצריא התחברות לחשבון, ולכן כאן
  // מוצגים הנתונים שה-API מחזיר (ratingAvg/ratingCount/ratingBreakdown)
  // ואין אפשרות לדרג. שדות חסרים (API ישן) = "אין דירוגים" ולא שגיאה.
  function ratingOf(p) {
    const count = Number(p && p.ratingCount) || 0;
    const avg = Number(p && p.ratingAvg) || 0;
    return {
      count,
      avg,
      verified: Number(p && p.ratingVerifiedCount) || 0,
      breakdown: Array.isArray(p && p.ratingBreakdown) ? p.ratingBreakdown : [],
      rated: count > 0 && avg > 0,
    };
  }

  function fmtAvg(avg) {
    return Number(avg).toLocaleString(numLocale, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  // חמישה כוכבים עם מילוי חלקי לפי הממוצע
  function starsHtml(avg, sizeClass) {
    const pct = Math.max(0, Math.min(Number(avg) || 0, 5)) / 5 * 100;
    const row = STAR_ICON.repeat(5);
    return `<span class="stars${sizeClass ? ' ' + sizeClass : ''}" aria-hidden="true">`
      + `<span class="stars-base">${row}</span>`
      + `<span class="stars-fill" style="width:${pct}%">${row}</span>`
      + `</span>`;
  }

  // תגית דירוג לכרטיס ולדף הפרטים. תוסף שטרם דורג אינו מקבל תגית כלל
  // (בשונה מההורדות) — "0 כוכבים" היה נראה כדירוג גרוע ולא כהיעדר דירוג.
  function ratingBadge(p) {
    const r = ratingOf(p);
    if (!r.rated) return '';
    return `<span class="badge badge-rating" title="${esc(t('דירוג ממוצע מתוך {n} מדרגים', { n: fmtNum(r.count) }))}">`
      + starsHtml(r.avg)
      + `${esc(fmtAvg(r.avg))}<span class="badge-rating-count">${esc(t('({n})', { n: fmtNum(r.count) }))}</span>`
      + `</span>`;
  }

  // לוח הדירוגים בדף הפרטים: הממוצע, התפלגות 5★→1★ והערה שהדירוג נעשה באתר
  function ratingCardHtml(p) {
    const r = ratingOf(p);
    const body = r.rated
      ? `<div class="rating-summary">
          <div class="rating-score">
            <div class="rating-score-num">${esc(fmtAvg(r.avg))}</div>
            ${starsHtml(r.avg, 'stars-lg')}
            <div class="rating-score-meta">${esc(t('{n} מדרגים', { n: fmtNum(r.count) }))}</div>
          </div>
          <div class="rating-rows">
            ${[5, 4, 3, 2, 1].map(star => {
              const count = Number(r.breakdown[star - 1]) || 0;
              const pct = r.count > 0 ? (count / r.count) * 100 : 0;
              return `<div class="rating-row">
                <span class="rating-row-star">${esc(String(star))}${STAR_ICON}</span>
                <span class="rating-bar"><span class="rating-bar-fill" style="width:${pct}%"></span></span>
                <span class="rating-row-count">${esc(fmtNum(count))}</span>
              </div>`;
            }).join('')}
          </div>
        </div>
        ${r.verified > 0
          ? `<div class="rating-note"><span class="rating-verified">${esc(t('{n} דירוגים מאומתים', { n: fmtNum(r.verified) }))}</span> — ${esc(t('מדרגים שהתקנת התוסף אצלם נרשמה בפועל'))}</div>`
          : ''}
        <div class="rating-note">${esc(t('הדירוג נאסף בדף התוסף באתר החנות'))}</div>`
      : `<div class="rating-empty">${esc(t('התוסף עדיין לא דורג'))}</div>
         <div class="rating-note">${esc(t('הדירוג נאסף בדף התוסף באתר החנות'))}</div>`;

    return `<div class="detail-card">
      <h2><span class="icon">${STAR_OUTLINE_ICON}</span> ${esc(t('דירוג המשתמשים'))}</h2>
      ${body}
    </div>`;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(dateStr) {
    try {
      const d = dateStr.includes('T') ? new Date(dateStr) : new Date(dateStr + 'T12:00:00Z');
      return d.toLocaleDateString(numLocale, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
    } catch { return dateStr; }
  }

  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }

  // ── מעקב תוצאת התקנה ─────────────────────────────────────────────
  // לפני ההתקנה יוצרים טוקן חד-פעמי מול ה-API של האתר, מוסרים אותו לאוצריא
  // (שמדווחת עליו הצלחה/כישלון), ועושים polling על הסטטוס כדי להציג את
  // התוצאה על הכפתור. כשל בכל שלב כאן אינו עוצר את ההתקנה — פשוט אין מעקב
  // (בדיוק ההתנהגות הישנה, "נשלח ✓").
  const POLL_INTERVAL_MS = 2000;
  const POLL_TIMEOUT_MS = 2 * 60 * 1000;

  async function apiFetch(url, options) {
    const res = await Otzaria.call('network.fetch', { url, ...(options || {}) });
    if (!res.success) throw new Error(res.error?.message || t('שגיאת רשת'));
    return res.data;
  }

  // מאתר את התוסף בקטלוג לפי כתובת ההורדה שלו (הכפתורים נושאים רק data-url).
  function pluginByDownloadUrl(downloadUrl) {
    return allPlugins.find(p => {
      const u = p.downloadUrl.startsWith('http') ? p.downloadUrl : BASE + p.downloadUrl;
      return u === downloadUrl;
    }) || null;
  }

  function pluginIdByDownloadUrl(downloadUrl) {
    const p = pluginByDownloadUrl(downloadUrl);
    return p ? p.id : null;
  }

  // רישום התקנה/עדכון שהצליחו במפת המותקנים — כדי שכרטיסים אחרים ומעבר בין
  // תצוגות ישקפו מיד "מותקן ✓", בלי להמתין לרענון מלא של החנות.
  function markInstalled(plugin) {
    if (!plugin) return;
    installedVersionByName.set(plugin.name, plugin.version);
    const existing = installedPlugins.find(p => p.name === plugin.name);
    if (existing) existing.version = plugin.version;
    else installedPlugins.push({ name: plugin.name, version: plugin.version });
  }

  async function createInstallToken(downloadUrl) {
    const pluginId = pluginIdByDownloadUrl(downloadUrl);
    if (!pluginId) return null;
    try {
      const res = await apiFetch(`${API}/${pluginId}/install-token`, { method: 'POST' });
      if (res.status !== 200) return null;
      return JSON.parse(res.body).token || null;
    } catch { return null; }
  }

  // polling על תוצאת ההתקנה; מחזיר 'success' | 'failure' | 'no_report'.
  async function waitForInstallResult(token) {
    const startedAt = Date.now();
    while (Date.now() - startedAt < POLL_TIMEOUT_MS) {
      await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
      try {
        const res = await apiFetch(`${BASE}/api/plugins/install-result?token=${encodeURIComponent(token)}`);
        if (res.status === 404) return 'no_report';
        if (res.status !== 200) continue;
        const data = JSON.parse(res.body);
        if (data.status === 'success' || data.status === 'failure') return data.status;
      } catch { /* שגיאת רשת זמנית — ננסה שוב */ }
    }
    return 'no_report';
  }

  // התקנה/עדכון עם מעקב: מציג ספינר לאורך ההמתנה ומעדכן את הכפתור לפי
  // התוצאה שדווחה מאוצריא. הניסוח מותאם לפעולה — עדכון תוסף מותקן אינו
  // "התקנה". isUpdate נמסר מהקורא; אם לא — נגזר ממצב ההתקנה בפועל.
  async function installPluginTracked(btn, downloadUrl, isUpdate) {
    const plugin = pluginByDownloadUrl(downloadUrl);
    const updating = isUpdate !== undefined
      ? isUpdate
      : Boolean(plugin && installStateOf(plugin) === 'update');
    const words = updating
      ? { progress: t('מעדכן...'), success: t('עודכן בהצלחה!'), failure: t('העדכון נכשל - לחץ שוב לנסיון נוסף') }
      : { progress: t('מתקין...'), success: t('הותקן בהצלחה!'), failure: t('ההתקנה נכשלה - לחץ שוב לנסיון נוסף') };

    btn.disabled = true;
    btn.innerHTML = `<span class="btn-spinner"></span>${esc(words.progress)}`;
    const token = await createInstallToken(downloadUrl);
    try {
      await Otzaria.call('plugin.requestInstall', {
        url: downloadUrl,
        ...(token ? { token, callback: `${BASE}/api/plugins/install-result` } : {}),
      });
    } catch (err) {
      btn.disabled = false;
      btn.textContent = t('שגיאה');
      return 'failure';
    }
    // ללא טוקן אין מעקב — לא מסמנים כמותקן כדי לא להצהיר על תוצאה שאינה ידועה
    if (!token) { btn.textContent = t('נשלח ✓'); return 'no_report'; }

    const result = await waitForInstallResult(token);
    if (result === 'success') {
      btn.textContent = words.success;
      markInstalled(plugin);
    } else if (result === 'failure') {
      btn.disabled = false;
      btn.textContent = words.failure;
    } else {
      btn.textContent = t('נשלח ✓');
    }
    return result;
  }

  document.getElementById('grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.install-btn');
    if (!btn) return;
    installPluginTracked(btn, btn.dataset.url, btn.dataset.update === '1');
  });

  // כפתורי התקנה גם בכרטיסי דף הבית האצור (נבחרים ושורות קטגוריה)
  document.getElementById('home').addEventListener('click', (e) => {
    const btn = e.target.closest('.install-btn');
    if (!btn) return;
    installPluginTracked(btn, btn.dataset.url, btn.dataset.update === '1');
  });

  document.getElementById('lightbox-close').onclick = () => hide('lightbox');
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) hide('lightbox');
  });

  // חיפוש: debounce קצר ואז חיפוש חכם בשרת; ריקון מחזיר לתצוגה הנוכחית
  document.getElementById('search').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    clearTimeout(searchTimer);
    if (!searchQuery) {
      searchSeq++;
      renderCurrentView();
      return;
    }
    searchTimer = setTimeout(renderCurrentView, 300);
  });
  document.getElementById('status-filter').addEventListener('change', renderCurrentView);

  // סוויץ' "הסתר מותקנים" — שמירת הבחירה + רענון; אם דף הבית התרוקן עוברים לרשימה
  const hideInstalledEl = document.getElementById('hide-installed');
  hideInstalledEl.checked = hideInstalled;
  hideInstalledEl.addEventListener('change', () => {
    hideInstalled = hideInstalledEl.checked;
    try { localStorage.setItem(HIDE_INSTALLED_KEY, hideInstalled ? '1' : '0'); } catch {}
    persistentSet(HIDE_INSTALLED_KEY, hideInstalled);
    if (currentView.type === 'home' && !hasCuratedHome()) currentView = { type: 'all' };
    renderCurrentView();
  });

  loadPlugins();
</script>
</body>
</html>
