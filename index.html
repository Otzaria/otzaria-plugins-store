<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חנות תוספים</title>
  <!-- מילוני התרגום מוטמעים בתוסף (ללא רשת). שפה ללא מילון נשארת בעברית. -->
  <script src="i18n/en.js"></script>
  <style>
    /* ── טוקני עיצוב ──
       הצבעים בשמות התפקידים של Material 3 — אותם שמות כמו ב-colorScheme של אוצריא,
       ו-applyTheme ממלא אותם מה-theme האמיתי. הערכים כאן הם ברירת מחדל בלבד (מארח
       שאינו שולח theme): הפלטה של אתר החנות (otzaria.org/plugins), כדי שגם אז התוסף
       ייראה כמו האתר. ── */
    :root {
      /* משטחים: רקע הדף, ומעליו הכרטיסים (surface) — שטוחים, בלי מסגרת ובלי צל */
      --color-background: #f8f1ea;
      --color-surface: #fff8f4;
      --color-surface-container-low: #fff1e5;
      --color-surface-container: #f9ecdf;
      /* רקע פס הכותרת — surfaceContainerHigh של אוצריא (ראה applyTheme) */
      --color-surface-container-high: #f3e6da;
      --color-surface-container-highest: #ede0d4;
      --color-on-surface: #3a2610;
      --color-on-surface-variant: #664d33;
      /* outline — מסגרת שדה וכפתור outlined; outline-variant — קו הפרדה, מסגרת שבב */
      --color-outline: #817567;
      --color-outline-variant: #d3c4b4;
      --color-primary: #805610;
      --color-on-primary: #fff;
      /* secondaryContainer — כפתור טונלי, שבב נבחר, אריח אייקון, תג "יציב" */
      --color-secondary-container: #fbdebc;
      --color-on-secondary-container: #56442a;
      --color-error: #ba1a1a;
      --color-error-container: #ffdad6;
      --color-on-error-container: #93000a;
      /* inverse — הודעת "תוסף חדש" (snackbar של M3) */
      --color-inverse-surface: #362f27;
      --color-on-inverse-surface: #fcefe2;
      --color-inverse-primary: #f4bd6f;
      --color-scrim: #3a2610;
      --color-shadow: #2e1c08;
      /* טקסט/אייקון מעל שכבה חוצצת כהה (lightbox) — תמיד בהיר, גם במצב כהה */
      --color-on-scrim: #fff;

      /* תפקידים שאין להם מקבילה ב-theme של אוצריא — מקומיים, ולכן מוגדרים גם
         ב-body.dark-mode: כוכבי הדירוג, תג "ניסיוני" (warning) ותג המאומתים (success) */
      --color-rating-star: #c98a05;
      --color-warning-container: #f0e8d0;
      --color-on-warning-container: #7a5010;
      --color-success-container: #e8f0e0;
      --color-on-success-container: #3a6020;

      /* נגזרים — שכבות מצב של M3 (ריחוף = 8% מצבע התוכן מעל המשטח), החשכה וצללים.
         מחושבים מתוך התפקידים שלמעלה, ולכן מתעדכנים לבד עם ה-theme. */
      --color-hover: color-mix(in srgb, var(--color-primary) 8%, transparent);
      /* כרטיס/שבב בריחוף — cardSelectionOverlay של אוצריא: secondaryContainer ב-30%
         מעל הכרטיס (בפלטת ברירת המחדל יוצא בדיוק צבע הריחוף של האתר) */
      --color-surface-hover: color-mix(in srgb, var(--color-secondary-container) 30%, var(--color-surface));
      --color-primary-hover: color-mix(in srgb, var(--color-on-primary) 8%, var(--color-primary));
      --color-secondary-container-hover: color-mix(in srgb, var(--color-on-secondary-container) 8%, var(--color-secondary-container));
      --color-scrim-dialog: color-mix(in srgb, var(--color-scrim) 45%, transparent);
      --color-scrim-lightbox: color-mix(in srgb, var(--color-scrim) 88%, transparent);
      /* נקודת הזהב של קישוט הכותרת — באתר זהב קבוע; כאן נגזרת מ-primary של ה-theme */
      --color-ornament: color-mix(in srgb, var(--color-primary) 70%, var(--color-background));
      --shadow-dialog: 0 16px 48px color-mix(in srgb, var(--color-shadow) 24%, transparent);
      --shadow-toast: 0 8px 24px color-mix(in srgb, var(--color-shadow) 28%, transparent);

      /* גופן הממשק (DESIGN_GUIDE § טיפוגרפיה): uiFontFamily של אוצריא — sans
         שנשאר חד בגדלים קטנים. גופן הקריאה (fontFamily) הוא לטקסט ספר בלבד
         ואינו מוחל על ממשק. הערך כאן הוא ברירת מחדל למארח שאינו שולח את השדה. */
      --font-ui: 'Rubik', 'Segoe UI', system-ui, sans-serif;
      --fs-11: 11px; --fs-13: 13px; --fs-14: 14px; --fs-15: 15px;
      --fs-17: 17px; --fs-18: 18px; --fs-20: 20px; --fs-26: 26px; --fs-40: 40px;
      /* גדלי פס הכותרת — px קשיח בכוונה (DESIGN_GUIDE § סרגל כותרת התוסף):
         הפס חייב להתיישר עם הסרגל של אוצריא ולא לגדול עם גופן הספר */
      --fs-topbar-title: 16px; --fs-topbar-sub: 12px;
      /* פינות — אוצריא עברה לרדיוס אחיד של 8 לכל רכיב (AppTokens.radius): כרטיס, כפתור
         (גם כפתור אייקון), שדה, שבב, תג, חלונית. 3 נשאר רק לאלמנטים זעירים (פס דירוג,
         scrollbar, שורת טקסט בשלד הטעינה); pill — רק למסילת המתג (ה-Switch של אוצריא) */
      --radius-3: 3px; --radius-8: 8px; --radius-pill: 999px;
      /* תנועה — כמו באתר: מעבר צבע 180ms בעקומה הסטנדרטית */
      --motion: 180ms cubic-bezier(.4, 0, .2, 1);
    }

    /* ── מצב כהה: רוב הצבעים מגיעים מ-theme של אוצריא (applyTheme).
       כאן רק טוקנים שה-theme אינו מספק — דירוג ותגי מצב. ── */
    body.dark-mode {
      color-scheme: dark;
      --color-rating-star: #e0bd66;
      --color-warning-container: #34301a;
      --color-on-warning-container: #e0bd66;
      --color-success-container: #21311f;
      --color-on-success-container: #a3cf86;
    }

    /* פס הכותרת קבוע והתוכן הוא שגולל — לכן העמוד עצמו אינו גולל כלל */
    html, body { height: 100%; overflow: hidden; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* בחירת טקסט כבויה בשלד (DESIGN_GUIDE § בחירת טקסט): לחיצה ברווח בין כרטיסים
       לא צובעת את הדף. רק התיאורים בדף הפרטים ושדה החיפוש ניתנים לבחירה. */
    body {
      font-family: var(--font-ui);
      background: var(--color-background);
      color: var(--color-on-surface);
      user-select: none;
      -webkit-user-select: none;
    }
    input, .detail-desc, .detail-about { user-select: text; -webkit-user-select: text; }
    /* כפתורים ושדות — בגופן הממשק (ברירת המחדל של הדפדפן להם היא גופן מערכת) */
    button, input, select { font-family: var(--font-ui); }
    button { cursor: pointer; }
    /* טבעת פוקוס אחידה למקלדת (כמו באתר: 2px primary, מרווח 2px) */
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    svg { flex-shrink: 0; }
    /* טקסט של המפתח (שם, תיאור — dir="auto", אולי באנגלית) מיושר לכיוון העמוד ולא
       לכיוון הטקסט עצמו, כמו באתר: כך שם באנגלית עומד באותו קו עם השמות שלצדו */
    html[dir="rtl"] :is(.card-link, .card-desc, .detail-name, .detail-desc, .detail-about, .update-name) { text-align: right; }
    html[dir="ltr"] :is(.card-link, .card-desc, .detail-name, .detail-desc, .detail-about, .update-name) { text-align: left; }
    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }
    .hidden { display: none !important; }

    /* פסי גלילה פנימיים (סרגל קטגוריות, שורות בדף הבית, צילומי מסך) — דקים */
    .scroll-x { scrollbar-width: thin; scrollbar-color: var(--color-outline-variant) transparent; }
    .scroll-x::-webkit-scrollbar { height: 6px; }
    .scroll-x::-webkit-scrollbar-thumb { background: var(--color-outline-variant); border-radius: var(--radius-3); }

    .app-shell { display: flex; flex-direction: column; height: 100%; }
    .app-content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; }

    /* ── סרגל כותרת התוסף (Top Bar) ──
       אוצריא אינה מציירת כותרת מעל ה-WebView, ולכן שם התוסף יושב בפס עליון קבוע
       ברקע surfaceContainerHigh — אותו צבע וגובה כמו הסרגל העליון של מסכי הספרים.
       הגדלים כאן ב-px קשיחים בכוונה (יחידות יחסיות היו מתפוצצות עם גופן ספר גדול). */
    .topbar {
      background: var(--color-surface-container-high);
      border-bottom: 1px solid var(--color-outline-variant);
      height: 56px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .topbar h1 {
      margin: 0;
      font-size: var(--fs-topbar-title);
      font-weight: 600;
      color: var(--color-on-surface);
      white-space: nowrap;
    }
    #plugin-count {
      flex: 1;
      min-width: 0;
      font-size: var(--fs-topbar-sub);
      color: var(--color-on-surface-variant);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 600px) {
      .topbar { height: 44px; padding: 0 10px; }
    }

    /* ── כפתור אייקון (רענון, סגירת חלונית, סגירת הודעה) — ריבוע בפינות 8 ── */
    .icon-btn {
      width: 40px; height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius-8);
      background: transparent;
      color: var(--color-on-surface-variant);
      transition: background-color var(--motion), color var(--motion);
    }
    .icon-btn:hover { background: var(--color-hover); color: var(--color-on-surface); }
    .icon-btn svg { width: 24px; height: 24px; }
    #refresh-btn { width: 36px; height: 36px; }
    #refresh-btn svg { width: 22px; height: 22px; }
    /* בזמן טעינה מסתובב רק הגליף, לא הכפתור */
    #refresh-btn.spinning svg { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── כפתורים (כמו ui/Button באתר; פינות 8 כמו אוצריא) ──
       filled — הפעולה הראשית במסך; tonal — פעולה משנית חשובה; outlined — משנית
       רגילה; text — פעולה שקטה. גובה 36 (sm) / 40 (md) — צפוף יותר מהאתר, כמו אוצריא. */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 36px;
      padding: 6px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-8);
      background: transparent;
      color: var(--color-primary);
      font-size: var(--fs-13);
      font-weight: 600;
      line-height: 1.3;
      text-align: center;
      transition: background-color var(--motion), color var(--motion), border-color var(--motion);
    }
    .btn svg { width: 20px; height: 20px; }
    .btn-md { min-height: 40px; padding-inline: 20px; font-size: var(--fs-15); }
    .btn-md svg { width: 22px; height: 22px; }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-filled { background: var(--color-primary); color: var(--color-on-primary); }
    .btn-filled:hover:not(:disabled) { background: var(--color-primary-hover); }
    .btn-tonal { background: var(--color-secondary-container); color: var(--color-on-secondary-container); }
    .btn-tonal:hover:not(:disabled) { background: var(--color-secondary-container-hover); }
    .btn-outlined { border-color: var(--color-outline); }
    .btn-outlined:hover:not(:disabled), .btn-text:hover:not(:disabled) { background: var(--color-hover); }
    .btn-text { padding-inline: 12px; }

    /* ספינר קטן בתוך כפתור התקנה בזמן המתנה לתוצאה (הרווח מהטקסט — gap של הכפתור) */
    .btn-spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    /* ── שדות: חיפוש ובחירה (כמו fieldStyles באתר) ──
       מסגרת outline, בריחוף כהה יותר, ובפוקוס מסגרת primary בעובי 2px
       (הגבול + outline פנימי של 1px). האייקון יושב בעוטף, במיקום לוגי. */
    .field {
      display: block;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--color-outline);
      border-radius: var(--radius-8);
      background: var(--color-surface);
      color: var(--color-on-surface);
      font-size: var(--fs-14);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color var(--motion);
    }
    .field:hover { border-color: var(--color-on-surface-variant); }
    .field:focus, .field:focus-visible {
      border-color: var(--color-primary);
      outline: 1px solid var(--color-primary);
      outline-offset: -2px;
    }
    .field::placeholder { color: var(--color-on-surface-variant); opacity: 1; }
    .field-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--color-on-surface-variant);
    }
    .search-field { position: relative; flex: 1 1 260px; min-width: 0; }
    .search-field .field { padding-inline: 46px 14px; }
    .search-field .field-icon { inset-inline-start: 14px; width: 22px; height: 22px; }
    /* כפתור הניקוי של שדה החיפוש — גליף close בצבע הטקסט המשני, במקום ה-× הכחול של הדפדפן */
    .search-field .field::-webkit-search-cancel-button {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      margin-inline-start: 8px;
      background: var(--color-on-surface-variant);
      -webkit-mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z'/></svg>") center / contain no-repeat;
      mask: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z'/></svg>") center / contain no-repeat;
      cursor: pointer;
    }
    .select-field { position: relative; flex: none; }
    .select-field .field { padding-inline: 14px 42px; cursor: pointer; }
    .select-field .field-icon { inset-inline-end: 12px; width: 22px; height: 22px; }

    /* ── פילטרים ── */
    #filters {
      padding: 16px 20px 0;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 12px;
      align-items: center;
    }

    /* ── סוויץ' "הסתר מותקנים" — Switch של M3 כמו SwitchSettingsTile באוצריא ──
       ה-input מוסתר חזותית בלבד (לא display:none), כדי שיישאר נגיש במקלדת. */
    #hide-installed-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-size: var(--fs-13);
      font-weight: 600;
      color: var(--color-on-surface);
      cursor: pointer;
      white-space: nowrap;
    }
    #hide-installed-wrap input {
      position: absolute;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    /* מסילת המתג — החריג היחיד לרדיוס 8: גלולה, כמו ה-Switch של אוצריא (COOKBOOK § Switch) */
    #hide-installed-wrap .switch {
      width: 40px; height: 24px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--color-outline);
      background: var(--color-surface-container-highest);
      position: relative;
      flex-shrink: 0;
      transition: background-color var(--motion), border-color var(--motion);
    }
    /* מיקום לוגי (inset-inline) — הידית נעה נכון גם ב-rtl וגם ב-ltr */
    #hide-installed-wrap .switch::after {
      content: '';
      position: absolute;
      top: 50%;
      inset-inline-start: 4px;
      width: 12px; height: 12px;
      margin-top: -6px;
      border-radius: 50%;
      background: var(--color-outline);
      transition: inset-inline-start var(--motion), width var(--motion), height var(--motion),
        margin var(--motion), background-color var(--motion);
    }
    #hide-installed-wrap input:checked + .switch { background: var(--color-primary); border-color: var(--color-primary); }
    #hide-installed-wrap input:checked + .switch::after {
      inset-inline-start: 18px;
      width: 16px; height: 16px;
      margin-top: -8px;
      background: var(--color-on-primary);
    }
    #hide-installed-wrap input:focus-visible + .switch { outline: 2px solid var(--color-primary); outline-offset: 2px; }

    /* ── שבבים (כמו ui/Chip באתר): קטגוריות, תגיות ──
       רגיל — משטח surface ומסגרת outline-variant; נבחר — המשטח הטונלי ומסגרת primary
       (המסגרת היא שמבדילה את המצב, לא רק הרקע). */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      max-width: 100%;
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--color-outline-variant);
      border-radius: var(--radius-8);
      background: var(--color-surface);
      color: var(--color-on-surface-variant);
      font-size: var(--fs-13);
      font-weight: 600;
      white-space: nowrap;
      transition: background-color var(--motion), color var(--motion), border-color var(--motion);
    }
    .chip:hover { border-color: var(--color-outline); color: var(--color-on-surface); background: var(--color-surface-hover); }
    .chip.active {
      border-color: var(--color-primary);
      background: var(--color-secondary-container);
      color: var(--color-on-secondary-container);
    }
    .chip.active:hover { background: var(--color-secondary-container-hover); }
    .chip-count { font-size: var(--fs-11); font-weight: 400; opacity: .8; font-variant-numeric: tabular-nums; }

    /* ── סרגל קטגוריות — שורה אחת נגללת במסך צר, נשברת לשורות כשיש מקום ── */
    #cats-bar {
      padding: 14px 20px 2px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    @media (min-width: 700px) {
      #cats-bar { flex-wrap: wrap; overflow-x: visible; }
    }

    /* ── תגיות ── */
    #tags-wrap { padding: 12px 20px 0; }
    #tags { display: flex; flex-wrap: wrap; gap: 8px; }
    #tags.collapsed { overflow: hidden; }
    #tags-toggle { margin-top: 6px; margin-inline-start: -12px; }

    /* ── כרטיס תוסף (כמו PluginCard באתר) ──
       שטוח: משטח surface בלי מסגרת ובלי צל; ריחוף = החלפת רקע בלבד (בלי הרמה).
         [אייקון]  שם התוסף (עד 2 שורות)
                   ★ 4.6 (12)  ⤓ 2,473  גרסה 1.2.0 [בטא]
         תיאור קצר — תמיד בגובה שתי שורות, כדי שהכפתורים בשורת כרטיסים יתיישרו
         [התקנה]   ← דבוק לתחתית */
    #grid, .home-grid, .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    #grid { padding: 16px 20px 24px; }
    @media (min-width: 768px) {
      #grid, .home-grid, .skeleton-grid { gap: 20px; }
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--color-surface);
      border-radius: var(--radius-8);
      cursor: pointer;
      transition: background-color var(--motion);
    }
    .card:hover { background: var(--color-surface-hover); }
    .card-head { display: flex; align-items: flex-start; gap: 16px; }
    .card-head-text { flex: 1; min-width: 0; }
    .card-title {
      font-size: var(--fs-17);
      font-weight: 700;
      line-height: 1.375;
      color: var(--color-on-surface);
      transition: color var(--motion);
    }
    .card:hover .card-title { color: var(--color-primary); }
    /* כל הכרטיס לחיץ: כפתור השם (נגיש במקלדת) נמתח על הכרטיס כולו ב-::after,
       וטבעת הפוקוס שלו מצוירת סביב הכרטיס. הכפתורים שבתחתית יושבים מעליו. */
    .card-link {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      outline: none;
    }
    .card-link::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius-8); }
    .card-link:focus-visible::after { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .card-title-text {
      display: -webkit-box;
      -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .card-desc {
      font-size: var(--fs-13);
      line-height: 1.625;
      min-height: 3.25em;
      color: var(--color-on-surface-variant);
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2; line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-actions {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }
    .card-actions .btn { flex: 1 1 auto; }
    /* "התקנה" טונלית — ברשת של כרטיסים אין "פעולה ראשית אחת", ושורה של כפתורים מלאים
       מכבידה; "עדכון" מלא, כדי שתוסף שממתין לעדכון יבלוט */
    .card-actions .btn[data-update="1"] { background: var(--color-primary); color: var(--color-on-primary); }
    .card-actions .btn[data-update="1"]:hover:not(:disabled) { background: var(--color-primary-hover); }
    @media (min-width: 640px) {
      .card { padding: 20px; }
      .card .plugin-icon { width: 72px; height: 72px; }
    }

    /* אייקון התוסף — אריח ריבועי (התמונה היא אייקון, לא באנר), object-fit contain.
       בלי תמונה — הלוגו של אוצריא בחצי הגודל, על המשטח הטונלי. */
    .plugin-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 64px; height: 64px;
      overflow: hidden;
      border-radius: var(--radius-8);
      background: var(--color-surface-container);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-outline-variant) 70%, transparent);
    }
    .plugin-icon img { width: 100%; height: 100%; object-fit: contain; }
    .plugin-icon.is-fallback img { width: 50%; height: 50%; opacity: .8; }
    .plugin-icon-sm { width: 40px; height: 40px; }
    .plugin-icon-hero { width: 96px; height: 96px; }
    /* האייקונים מגיעים עם שוליים לבנים מובנים — באריח הגדול חותכים מהם מעט */
    .plugin-icon-hero:not(.is-fallback) img { transform: scale(1.1); }
    @media (min-width: 640px) {
      .plugin-icon-hero { width: 120px; height: 120px; }
    }

    /* שורת המטא (כמו PluginMeta באתר): בלי מפרידים "·" — לכל פריט סימן משלו */
    .plugin-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 12px;
      margin-top: 6px;
      font-size: var(--fs-13);
      color: var(--color-on-surface-variant);
    }
    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .meta-item svg { width: 1.1em; height: 1.1em; }
    .meta-rating svg { color: var(--color-rating-star); }
    .meta-strong { color: var(--color-on-surface); }
    .meta-version { gap: 6px; }

    /* ── תגים (כמו ui/Badge באתר): ניטרלי כברירת מחדל ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      padding: 0 10px;
      border-radius: var(--radius-8);
      background: var(--color-surface-container-highest);
      color: var(--color-on-surface-variant);
      font-size: var(--fs-11);
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
    }
    .badge svg { width: 1.15em; height: 1.15em; }
    .badge-md { min-height: 26px; padding: 0 12px; font-size: var(--fs-13); }
    /* יציב — המשטח הטונלי; בטא — ניטרלי (ברירת המחדל); ניסיוני — אזהרה רכה */
    .badge-stable { background: var(--color-secondary-container); color: var(--color-on-secondary-container); }
    .badge-experimental { background: var(--color-warning-container); color: var(--color-on-warning-container); }
    .badge-success { background: var(--color-success-container); color: var(--color-on-success-container); }

    /* חמישה כוכבים בשתי שכבות: מסילה ריקה ומעליה שכבה צבועה שנחתכת ברוחב
       באחוזים. כך גם דירוג של 4.6 מוצג נכון בלי אייקון חצי-כוכב. */
    .stars { position: relative; display: inline-flex; line-height: 0; flex: none; }
    .stars-base { display: inline-flex; color: var(--color-outline-variant); }
    .stars-fill {
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      display: inline-flex;
      overflow: hidden;
      color: var(--color-rating-star);
    }
    .stars svg { width: 14px; height: 14px; flex: none; }
    .stars-lg svg { width: 26px; height: 26px; }

    /* ── מצבים: טעינה (שלד), ריק, שגיאה ── */
    /* שלד טעינה — משטחים במקום הכרטיסים שעוד לא הגיעו, באותן מידות (כמו ui/Skeleton) */
    #loading { padding: 16px 20px 24px; }
    .skeleton-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: var(--color-surface);
      border-radius: var(--radius-8);
    }
    .skeleton {
      display: block;
      background: var(--color-surface-container-high);
      border-radius: var(--radius-8);
      animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
    }
    .sk-icon { width: 64px; height: 64px; flex-shrink: 0; }
    .sk-lines { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
    .sk-title, .sk-meta, .sk-line { border-radius: var(--radius-3); }
    .sk-title { width: 75%; height: 18px; }
    .sk-meta { width: 66%; height: 13px; }
    .sk-line { height: 13px; }
    .sk-short { width: 83%; }
    .sk-btn { height: 36px; margin-top: 4px; }
    @media (min-width: 640px) {
      .skeleton-card { padding: 20px; }
      .sk-icon { width: 72px; height: 72px; }
    }
    @keyframes pulse { 50% { opacity: .5; } }

    /* כרטיס מצב (כמו ui/EmptyState באתר): אריח אייקון, כותרת, הסבר ופעולות */
    .state-card {
      margin: 20px;
      padding: 44px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--color-surface);
      border-radius: var(--radius-8);
    }
    .state-icon {
      width: 52px; height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-8);
      background: var(--color-secondary-container);
      color: var(--color-on-secondary-container);
    }
    .state-icon svg { width: 30px; height: 30px; }
    .state-title { margin-top: 18px; font-size: var(--fs-18); font-weight: 700; color: var(--color-on-surface); }
    .state-desc {
      margin-top: 8px;
      max-width: 460px;
      font-size: var(--fs-14);
      line-height: 1.6;
      color: var(--color-on-surface-variant);
    }
    #error-body { display: flex; flex-direction: column; align-items: center; }
    /* שגיאה אמיתית — אריח בגוון השגיאה; אין חיבור לאינטרנט — הודעה רגועה (לא אדומה)
       שגם משתמש לא-טכני יבין */
    #error:not(.offline) .state-icon { background: var(--color-error-container); color: var(--color-on-error-container); }
    #error .error-retry { margin-top: 22px; }

    /* ── קישוט כותרת (כמו TitleOrnament באתר): קו דק שדוהה בקצוות ונקודת זהב במרכזו.
       הרוחב יחסי לעטיפה שמעליו (heading-wrap — ברוחב הכותרת). ── */
    .heading-wrap { display: flex; flex-direction: column; width: fit-content; max-width: 100%; }
    .title-ornament {
      position: relative;
      display: block;
      width: max(120px, 70%);
      max-width: 100%;
      height: 7px;
      margin-top: 12px;
      margin-inline: auto;
    }
    .title-ornament.is-start { margin-inline-start: 0; }
    .title-ornament::before {
      content: '';
      position: absolute;
      inset-inline: 0;
      top: 3px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--color-outline-variant) 12%, var(--color-outline-variant) 88%, transparent);
    }
    .title-ornament::after {
      content: '';
      position: absolute;
      top: 0;
      left: calc(50% - 3.5px);
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--color-ornament);
      /* טבעת בצבע המשטח שמתחת — הנקודה "חותכת" את הקו */
      box-shadow: 0 0 0 3px var(--ornament-bg, var(--color-background));
    }
    .section-title { font-size: var(--fs-20); font-weight: 700; line-height: 1.3; color: var(--color-on-surface); }
    .section-head { margin-bottom: 16px; }

    /* ── חלונית עדכונים (כמו ui/Dialog באתר) ── */
    #updates-backdrop {
      position: fixed;
      inset: 0;
      background: var(--color-scrim-dialog);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fade-in 180ms ease-out;
    }
    #updates-modal {
      position: relative;
      width: 100%;
      max-width: 512px;
      max-height: min(85vh, 736px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--color-surface-container-high);
      border-radius: var(--radius-8);
      box-shadow: var(--shadow-dialog);
      animation: dialog-in 180ms ease-out;
    }
    @keyframes fade-in { from { opacity: 0; } }
    @keyframes dialog-in { from { opacity: 0; transform: translateY(20px); } }
    .modal-header, .modal-footer { flex-shrink: 0; }
    /* כותרת ממורכזת עם קישוט; כפתור הסגירה בפינת הסוף */
    .modal-header { position: relative; padding: 24px 56px 16px; text-align: center; }
    .modal-header h2 { font-size: var(--fs-20); font-weight: 700; color: var(--color-on-surface); }
    .modal-header .title-ornament { --ornament-bg: var(--color-surface-container-high); width: max(96px, 45%); }
    .modal-close { position: absolute; top: 12px; inset-inline-end: 12px; }
    .modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 8px; }
    .update-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .update-row:last-child { border-bottom: none; }
    .update-info { flex: 1; min-width: 0; }
    .update-name {
      font-size: var(--fs-15);
      font-weight: 600;
      color: var(--color-on-surface);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .update-versions {
      margin-top: 2px;
      font-size: var(--fs-13);
      color: var(--color-on-surface-variant);
      font-variant-numeric: tabular-nums;
    }
    .update-row .btn { flex-shrink: 0; white-space: nowrap; }
    .modal-footer {
      padding: 12px 24px;
      border-top: 1px solid var(--color-outline-variant);
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
    }

    /* ── דף פרטי תוסף (כמו עמוד התוסף באתר) ── */
    #detail-page {
      padding: 12px 20px 40px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .back-btn { margin-inline-start: -12px; margin-bottom: 12px; }
    /* החץ מצביע "אחורה" — ימינה ב-rtl, שמאלה ב-ltr */
    html[dir="ltr"] .back-btn svg { transform: scaleX(-1); }

    /* ראש העמוד: אייקון + שם (עם קישוט) + תג סטטוס, תיאור קצר ופעולות */
    .detail-hero-head { display: flex; align-items: center; gap: 16px; }
    .detail-hero-text { flex: 1; min-width: 0; }
    .detail-name {
      font-size: var(--fs-26);
      font-weight: 700;
      line-height: 1.25;
      color: var(--color-on-surface);
      overflow-wrap: anywhere;
    }
    .detail-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .detail-desc {
      margin-top: 16px;
      max-width: 72ch;
      font-size: var(--fs-15);
      line-height: 1.625;
      color: var(--color-on-surface-variant);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    @media (min-width: 640px) {
      .detail-hero-head { gap: 24px; }
    }

    /* נתוני המפתח — רצועה אחת: דירוג · הורדות · גרסה · תאימות · מפתח. קו הפרדה בין
       התאים; בתא הראשון של כל שורה הקו נדחף אל מחוץ לרצועה ונחתך (overflow) */
    .key-facts {
      display: flex;
      flex-wrap: wrap;
      row-gap: 12px;
      margin-top: 24px;
      padding: 14px 0;
      background: var(--color-surface);
      border-radius: var(--radius-8);
      overflow: hidden;
    }
    .key-fact {
      flex: 1 1 120px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 0 12px;
      margin-inline-start: -1px;
      border-inline-start: 1px solid var(--color-outline-variant);
      text-align: center;
    }
    .key-fact dt { font-size: var(--fs-11); color: var(--color-on-surface-variant); }
    .key-fact dd { display: flex; flex-direction: column; align-items: center; gap: 2px; max-width: 100%; }
    .key-fact-value {
      max-width: 100%;
      font-size: var(--fs-17);
      font-weight: 700;
      color: var(--color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }
    .key-fact-sub {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--fs-11);
      color: var(--color-on-surface-variant);
      font-variant-numeric: tabular-nums;
    }
    .key-fact-sub .stars svg { width: 12px; height: 12px; }

    /* הודעה: מוצגת גרסה ישנה יותר שתואמת לאוצריא של המשתמש */
    .detail-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: var(--radius-8);
      background: var(--color-warning-container);
      color: var(--color-on-warning-container);
      font-size: var(--fs-13);
      line-height: 1.6;
    }
    .detail-notice svg { width: 20px; height: 20px; margin-top: 1px; }

    /* גוף העמוד — אזורים עם כותרת וקישוט, ברווח אחד קבוע ביניהם */
    .detail-sections { display: flex; flex-direction: column; gap: 40px; margin-top: 40px; }
    .detail-section { min-width: 0; }
    .detail-columns { display: grid; gap: 40px; }
    @media (min-width: 820px) {
      .detail-columns { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .detail-columns.has-desc { grid-template-columns: minmax(0, 1fr) 340px; }
    }
    .detail-about {
      max-width: 72ch;
      font-size: var(--fs-15);
      line-height: 1.7;
      color: var(--color-on-surface);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* "מידע כללי" — רשימת הגדרות בשורות: תווית בצד ההתחלה, ערך בצד הסוף */
    .info-list { padding: 0 16px; background: var(--color-surface); border-radius: var(--radius-8); }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 46px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-outline-variant);
    }
    .info-row:last-child { border-bottom: none; }
    .info-row dt { flex-shrink: 0; font-size: var(--fs-13); color: var(--color-on-surface-variant); }
    .info-row dd {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 6px;
      text-align: end;
      font-size: var(--fs-15);
      font-weight: 600;
      color: var(--color-on-surface);
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }
    .info-row dd svg { width: 18px; height: 18px; color: var(--color-on-surface-variant); }
    .detail-sub { margin: 20px 0 8px; font-size: var(--fs-13); color: var(--color-on-surface-variant); }
    .detail-tags { display: flex; flex-wrap: wrap; gap: 8px; }

    /* לוח הדירוגים: הממוצע באריח, התפלגות 5★→1★ והערה שהדירוג נעשה באתר.
       הממוצע וההתפלגות זה לצד זה רק כשהלוח רחב מספיק (container query). */
    .rating-panel { padding: 16px; background: var(--color-surface); border-radius: var(--radius-8); container-type: inline-size; }
    .rating-summary { display: grid; gap: 20px; }
    @container (min-width: 440px) {
      .rating-summary:not(.is-empty) { grid-template-columns: 180px minmax(0, 1fr); gap: 28px; }
    }
    .rating-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 20px;
      text-align: center;
      background: var(--color-surface-container-low);
      border-radius: var(--radius-8);
    }
    .rating-score-num { font-size: var(--fs-40); font-weight: 700; line-height: 1; color: var(--color-on-surface); font-variant-numeric: tabular-nums; }
    .rating-score-meta { font-size: var(--fs-13); color: var(--color-on-surface-variant); }
    .rating-rows { display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 0; }
    .rating-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: var(--fs-13);
      color: var(--color-on-surface-variant);
      font-variant-numeric: tabular-nums;
    }
    .rating-row-star { display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px; flex: none; width: 30px; }
    .rating-row-star svg { width: 13px; height: 13px; color: var(--color-rating-star); }
    .rating-bar {
      flex: 1;
      height: 8px;
      border-radius: var(--radius-3);
      background: var(--color-surface-container-high);
      overflow: hidden;
      min-width: 0;
    }
    .rating-bar-fill { display: block; height: 100%; background: var(--color-rating-star); border-radius: var(--radius-3); }
    .rating-row-count { flex: none; min-width: 36px; text-align: start; }
    .rating-note {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--color-outline-variant);
      font-size: var(--fs-13);
      color: var(--color-on-surface-variant);
    }

    /* צילומי מסך — מסגרת 16/10 על משטח טונלי; לחיצה פותחת תצוגה מוגדלת */
    .screenshots-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
    .screenshot-thumb {
      flex-shrink: 0;
      width: 280px;
      aspect-ratio: 16/10;
      object-fit: contain;
      border: 1px solid var(--color-outline-variant);
      border-radius: var(--radius-8);
      background: var(--color-surface-container);
      cursor: zoom-in;
      scroll-snap-align: start;
      transition: border-color var(--motion);
    }
    .screenshot-thumb:hover { border-color: var(--color-outline); }

    /* ── lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: var(--color-scrim-lightbox);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fade-in 180ms ease-out;
    }
    #lightbox img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: var(--radius-8);
      object-fit: contain;
    }
    #lightbox-close {
      position: absolute;
      top: 16px;
      inset-inline-end: 16px;
      background: color-mix(in srgb, var(--color-on-scrim) 15%, transparent);
      color: var(--color-on-scrim);
    }
    #lightbox-close:hover { background: color-mix(in srgb, var(--color-on-scrim) 28%, transparent); color: var(--color-on-scrim); }

    /* ── הודעת תוסף חדש — snackbar של M3 (inverseSurface) ── */
    #new-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 80;
      max-width: calc(100% - 40px);
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      padding-inline-start: 16px;
      background: var(--color-inverse-surface);
      color: var(--color-on-inverse-surface);
      border-radius: var(--radius-8);
      box-shadow: var(--shadow-toast);
      animation: toast-in .3s ease;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translate(-50%, 24px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }
    #new-toast .toast-icon { display: flex; flex-shrink: 0; margin-inline-end: 4px; color: var(--color-inverse-primary); }
    #new-toast .toast-icon svg { width: 22px; height: 22px; }
    #new-toast .toast-text { font-size: var(--fs-14); font-weight: 600; flex: 1; white-space: nowrap; margin-inline-end: 6px; }
    #new-toast .toast-view { color: var(--color-inverse-primary); font-size: var(--fs-14); }
    #new-toast .toast-view:hover { background: color-mix(in srgb, var(--color-inverse-primary) 12%, transparent); }
    #new-toast .toast-close { width: 36px; height: 36px; color: var(--color-on-inverse-surface); }
    #new-toast .toast-close svg { width: 20px; height: 20px; }
    #new-toast .toast-close:hover { background: color-mix(in srgb, var(--color-on-inverse-surface) 12%, transparent); }

    /* ── דף הבית האצור ── */
    #home { padding: 24px 20px; display: flex; flex-direction: column; gap: 40px; }
    /* כותרת אזור (כמו StoreHomeSection באתר): כותרת + קישוט ותיאור; "לכל הקטגוריה" בקצה */
    .home-section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .home-section-head-text { min-width: 0; }
    .home-section-desc { margin-top: 10px; font-size: var(--fs-14); color: var(--color-on-surface-variant); }
    .home-see-all { flex-shrink: 0; white-space: nowrap; }
    .home-row { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x proximity; }
    .home-row .card { width: 280px; flex-shrink: 0; scroll-snap-align: start; }
    .home-footer-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding-top: 16px;
      border-top: 1px solid var(--color-outline-variant);
      font-size: var(--fs-13);
      color: var(--color-on-surface-variant);
    }

    /* ── כותרת תצוגה (קטגוריה / תוצאות חיפוש) ── */
    #view-title { padding: 24px 20px 4px; }
    #view-title p { margin-top: 10px; font-size: var(--fs-14); color: var(--color-on-surface-variant); }

    /* בלי תנועה למי שביקש זאת — השלד סטטי, החלונות נפתחים בלי אנימציה */
    @media (prefers-reduced-motion: reduce) {
      .skeleton, #updates-backdrop, #updates-modal, #lightbox, #new-toast { animation: none; }
      .card, .chip, .btn, .icon-btn, .field, .card-title, #hide-installed-wrap .switch,
      #hide-installed-wrap .switch::after { transition: none; }
    }
  </style>
</head>
