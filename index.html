<script>
  const BASE = 'https://otzaria.org';
  const API = BASE + '/api/plugins';
  // תמונת ברירת מחדל לתוסף ללא תמונה. נטענת ישירות מ-otzaria.org (כבר ב-allowlist),
  // לא נארזת בחבילה — הקובץ ~2MB והחנות ממילא דורשת רשת.
  // תמונת ברירת מחדל לתוסף בלי תמונה. logo.webp — הלוגו שהאתר עצמו מגיש
  // (logo.svg אינו קיים בשרת ומחזיר 404).
  const DEFAULT_IMG = BASE + '/logo.webp';

  // ── רב-לשוניות ───────────────────────────────────────────────────
  // עברית היא שפת הבסיס: מפתחות התרגום הם מחרוזות המקור בעברית, ושפה שאין לה
  // מילון (window.TRANSLATIONS[lang]) נשארת בעברית מאליה. השפה מגיעה מ-
  // payload.app של plugin.boot (או app.getLocale), ומתעדכנת חי דרך
  // settings.changed עם המפתח key-settings-language.
  let dict = null;                 // המילון הפעיל, או null לעברית
  let numLocale = 'he-IL';         // עיצוב מספרים ותאריכים
  let sortLocale = 'he';           // מיון תגיות

  function t(s, vars) {
    let out = (dict && dict[s]) || s;
    if (vars) for (const k in vars) out = out.split('{' + k + '}').join(vars[k]);
    return out;
  }

  // טקסט סטטי ב-HTML מסומן ב-data-t / data-t-title / data-t-placeholder /
  // data-t-aria-label (השם הנגיש של כפתורי אייקון ושדות בלי תווית גלויה),
  // כשהערך הוא מחרוזת המקור בעברית — כך אפשר לתרגם שוב בכל החלפת שפה.
  function translateStatic() {
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('[data-t-title]').forEach(el => { el.title = t(el.dataset.tTitle); });
    document.querySelectorAll('[data-t-placeholder]').forEach(el => { el.placeholder = t(el.dataset.tPlaceholder); });
    document.querySelectorAll('[data-t-aria-label]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.tAriaLabel)); });
    document.title = t('חנות תוספים');
  }

  function setLanguage(language, locale, textDirection) {
    const lang = language || 'he';
    dict = (window.TRANSLATIONS && window.TRANSLATIONS[lang]) || null;
    const dir = textDirection || (lang === 'he' ? 'rtl' : 'ltr');
    // ה-HTML הסטטי נשאר dir="rtl"; הכיוון האמיתי נקבע כאן בזמן ריצה
    document.documentElement.dir = dir;
    document.documentElement.lang = lang;
    numLocale = locale || (lang === 'he' ? 'he-IL' : 'en-US');
    sortLocale = lang;
    translateStatic();
    // אם הקטלוג כבר נטען — מרעננים את התצוגה כדי שהטקסט הדינמי יתורגם גם הוא
    if (allPlugins.length) { initTags(); initCatsBar(); renderCurrentView(); }
  }

  let allPlugins = [];
  let installedPlugins = [];   // [{ pluginId, name, version, isDev }] — ייחודי לפי מזהה
  let activeTag = 'all';
  let appVersion = null;       // גרסת אוצריא המותקנת, לסינון תאימות
  let appPlatform = null;      // מערכת ההפעלה ('windows'/'linux'/'macos'/'android'/'ios'), לסינון platforms

  // ── מצב תצוגה (אצירה) ──
  // storeHome — תשובת /api/plugins/store-home (null אם נכשלה: נופלים ל"כל התוספים").
  // currentView — 'home' (דף בית אצור) | 'all' (הרשימה המלאה) | 'category' (slug+name).
  // searchQuery — חיפוש פעיל גובר על התצוגה ומציג תוצאות מהחיפוש החכם בשרת.
  let storeHome = null;
  let currentView = { type: 'home' };
  let searchQuery = '';
  let searchTimer = null;
  let searchSeq = 0;                 // מונע תוצאות חיפוש ישנות מלדרוס חדשות
  let categoryCache = new Map();     // slug → תשובת ה-API של הקטגוריה

  // סוויץ' "הסתר מותקנים" — הבחירה נשמרת בין הפעלות. localStorage לא תמיד
  // שורד סגירה של ה-webview, לכן שומרים גם דרך אחסון התוסף של ה-SDK
  // (הרשאות plugin.storage.read/write); localStorage נשאר כגיבוי מקומי מהיר.
  const HIDE_INSTALLED_KEY = 'otzaria_store_hide_installed';
  let hideInstalled = false;
  try { hideInstalled = localStorage.getItem(HIDE_INSTALLED_KEY) === '1'; } catch {}

  // storage.get/set — אחסון KV של התוסף (עטיפת { success, data }, זמין מ-0.9.89).
  async function persistentGet(key) {
    try {
      const res = await Otzaria.call('storage.get', { key });
      return (res && res.success) ? res.data : null;
    } catch { return null; }
  }
  async function persistentSet(key, value) {
    try { await Otzaria.call('storage.set', { key, value }); } catch {}
  }

  const STATUS_KEYS = { stable: 'יציב', beta: 'בטא', experimental: 'ניסיוני' };
  const statusLabel = s => (STATUS_KEYS[s] ? t(STATUS_KEYS[s]) : null);
  const statusClass = { stable: 'badge-stable', beta: 'badge-beta', experimental: 'badge-experimental' };

  // ── עדכונים ─────────────────────────────────────────────────────
  // השוואת גרסאות SemVer: מחזיר 1 אם a>b, -1 אם a<b, 0 אם שוות.
  function compareVersions(a, b) {
    const parse = v => String(v ?? '').split('.').map(n => parseInt(n, 10) || 0);
    const pa = parse(a), pb = parse(b);
    const len = Math.max(pa.length, pb.length);
    for (let i = 0; i < len; i++) {
      const d = (pa[i] || 0) - (pb[i] || 0);
      if (d !== 0) return d > 0 ? 1 : -1;
    }
    return 0;
  }

  // ── בחירת הגרסה התואמת ─────────────────────────────────────────────
  // עובד בשני רבדים: כל קריאה ל-API נשלחת עם appVersion (ראו withAppVersion),
  // והשרת מחזיר כבר את הגרסה התואמת ומשמיט תוספים ללא גרסה תואמת; ובנוסף אותה
  // בחירה מתבצעת גם כאן על התשובה. הכפילות מכוונת: מול אתר ותיק שאינו מכיר את
  // הפרמטר החנות ממשיכה לעבוד נכון, והחישוב זהה ולכן אין סתירה בין השניים.
  //
  // גרסה (חיה או היסטורית) תואמת רק אם גרסת אוצריא בטווח [compatibleWith, maxAppVersion].
  // כשגרסת אוצריא אינה ידועה (כשל ב-app.getInfo) — לא מסתירים דבר.
  function isVersionCompatible(v, appVer) {
    if (!appVer) return true;
    if (v.compatibleWith && compareVersions(appVer, v.compatibleWith) < 0) return false;
    if (v.maxAppVersion && compareVersions(appVer, v.maxAppVersion) > 0) return false;
    return true;
  }

  // כל הגרסאות הזמינות לתוסף. ב-API החדש מגיע שדה versions (החיה + ההיסטוריה);
  // אם הוא חסר (API ישן) נופלים חזרה לגרסה החיה היחידה מהשדות העליונים.
  function pluginVersionCandidates(p) {
    if (Array.isArray(p.versions) && p.versions.length) return p.versions;
    return [{
      version: p.version,
      status: p.status,
      compatibleWith: p.compatibleWith,
      maxAppVersion: p.maxAppVersion,
      requiresNetwork: p.requiresNetwork,
      pluginFileSize: p.pluginFileSize,
      downloadUrl: p.downloadUrl,
      isLatest: true,
    }];
  }

  // הגרסה הגבוהה ביותר התואמת לגרסת אוצריא — null אם אין אף גרסה תואמת.
  function selectBestVersion(p, appVer) {
    return pluginVersionCandidates(p)
      .filter(v => isVersionCompatible(v, appVer))
      .sort((a, b) => compareVersions(b.version, a.version))[0] || null;
  }

  // מוסיף את גרסת אוצריא לכל קריאה ל-API של החנות. השרת מחזיר אז כל תוסף בגרסה
  // התואמת הגבוהה ביותר, משמיט תוספים ללא גרסה תואמת, ומתקן בהתאם גם את המונים
  // (pluginCount / totalPublicPlugins / total בחיפוש ובקטגוריה) והעימוד — דבר
  // שסינון מקומי אחרי הבקשה אינו יכול לעשות. אתר ותיק שאינו מכיר את הפרמטר
  // מתעלם ממנו, והסינון המקומי כאן מטפל בכל מקרה.
  function withAppVersion(url) {
    if (!appVersion) return url;
    return url + (url.includes('?') ? '&' : '?') + 'appVersion=' + encodeURIComponent(appVersion);
  }

  // הגרסה הגבוהה ביותר בכלל (ללא תלות בתאימות) — לזיהוי "קיימת גרסה חדשה יותר".
  function latestVersionOf(p) {
    return pluginVersionCandidates(p)
      .slice()
      .sort((a, b) => compareVersions(b.version, a.version))[0] || null;
  }

  // ממפה תוסף מהקטלוג ל"תוסף אפקטיבי" שגרסתו וקישור-ההורדה שלו הם הגרסה התואמת
  // הגבוהה ביותר (לא בהכרח האחרונה). מחזיר null אם אין אף גרסה תואמת — אז התוסף
  // לא יוצג ולא ייחשב לעדכון.
  // תוסף שהצהיר ב-manifest על "platforms" (החנות מחזירה את השדה ב-/api/plugins)
  // ואינו כולל את מערכת ההפעלה הנוכחית — לא יעבוד כאן, ולכן אינו מוצג. רשימה
  // ריקה/חסרה (תוסף שלא הגביל את עצמו, או אתר ותיק בלי השדה) או פלטפורמה לא
  // ידועה — לא מסתירים דבר.
  function supportsAppPlatform(p) {
    if (!appPlatform || !Array.isArray(p.platforms) || p.platforms.length === 0) return true;
    return p.platforms.includes(appPlatform);
  }

  function toEffectivePlugin(p) {
    if (!supportsAppPlatform(p)) return null;
    const best = selectBestVersion(p, appVersion);
    if (!best) return null;
    const latest = latestVersionOf(p);
    return {
      ...p,
      version: best.version,
      status: best.status || p.status,
      compatibleWith: best.compatibleWith,
      maxAppVersion: best.maxAppVersion,
      requiresNetwork: best.requiresNetwork ?? p.requiresNetwork,
      // גודל הקובץ של הגרסה המוצגת. קיים ב-versions של ה-API הנוכחי; ה-fallback
      // לשדה העליון (API עתידי) ול-0 שומר תאימות מלאה ל-API ישן שאין בו גודל כלל.
      pluginFileSize: best.pluginFileSize ?? p.pluginFileSize ?? 0,
      downloadUrl: best.downloadUrl || p.downloadUrl,
      // קיימת גרסה חדשה יותר שאינה תואמת לגרסת אוצריא הנוכחית של המשתמש
      newerIncompatibleVersion: latest && compareVersions(latest.version, best.version) > 0
        ? latest.version : null,
    };
  }

  // תוסף פיתוח נטען מתיקייה שהמפתח עורך (או משרת פיתוח מקומי) — הגרסה שלו אינה
  // באה מהחנות, ואין שום משמעות להציע לו "עדכון": לחיצה עליו הייתה מתקינה את
  // הגרסה הארוזה מעל העבודה המקומית. אוצריא מחריגה אותו גם בבדיקת העדכונים
  // הפנימית שלה. השדה sourceType קיים מ-0.9.98; בגרסאות קודמות הוא חסר, ואז
  // הכל נחשב packaged — בדיוק ההתנהגות שהייתה.
  function isDevInstall(p) {
    return p.sourceType === 'development' || p.sourceType === 'localhost_dev';
  }

  // ההתאמה בין מותקן לחנות היא לפי המזהה (pluginUid בקטלוג = pluginId מהמניפסט),
  // כך ששני תוספים שונים באותו שם אינם מתערבבים, ושינוי שם בחנות אינו מנתק את
  // התוסף המותקן. רק כשאחד הצדדים חסר מזהה (תוסף ישן בקטלוג, או אוצריא ישנה
  // שאינה מחזירה pluginId) — נופלים להתאמה לפי שם, כמו שהיה.
  function matchesInstalled(p, inst) {
    if (p.pluginUid && inst.pluginId) return p.pluginUid === inst.pluginId;
    return p.name === inst.name;
  }

  function installedKey(inst) {
    return inst.pluginId ? 'id:' + inst.pluginId : 'name:' + inst.name;
  }

  // כשמותקנים כמה עותקים של אותו תוסף (אותו מזהה) — משאירים רק את בעל הגרסה
  // הגבוהה, כדי שהעדכון יוצע פעם אחת ולא שורה לכל עותק. עותק פיתוח מסמן את
  // התוסף כולו כתוסף פיתוח (isDev), כדי שלא יוצע לו עדכון.
  function dedupeInstalled(list) {
    const byKey = new Map();
    const devKeys = new Set();
    for (const p of list || []) {
      const key = installedKey(p);
      if (isDevInstall(p)) devKeys.add(key);
      const prev = byKey.get(key);
      if (!prev || compareVersions(p.version, prev.version) > 0) byKey.set(key, p);
    }
    return [...byKey].map(([key, p]) => ({ ...p, isDev: devKeys.has(key) }));
  }

  // קולט את תשובת plugin.listInstalled. ה-pluginId משמש גם להתאמה מול החנות
  // וגם לפתיחת התוסף בפועל (plugin.openOther).
  function adoptInstalledList(list) {
    installedPlugins = dedupeInstalled(list);
  }

  // רענון רשימת המותקנים מאוצריא בלבד (בלי טעינת הקטלוג מחדש) — אחרי התקנה
  // מוצלחת, כדי לקבל את ה-pluginId של התוסף החדש ולאפשר לפתוח אותו מיד.
  async function refreshInstalledFromApp() {
    try {
      const res = await Otzaria.call('plugin.listInstalled', {});
      if (res && res.success) adoptInstalledList(res.data);
    } catch { /* נשארים עם המצב שידוע לנו */ }
  }

  // הרשומה המותקנת שתואמת לתוסף מהקטלוג, או null
  function findInstalled(p) {
    return (p && installedPlugins.find(inst => matchesInstalled(p, inst))) || null;
  }

  function installedIdOf(p) {
    const inst = findInstalled(p);
    return (inst && inst.pluginId) || null;
  }

  // פתיחת תוסף מותקן. pluginId שאינו מותקן מחזיר error.not_found; כל שאר
  // המצבים (מושבת/מוסתר מהכלים) מטופלים באוצריא עצמה עם הודעה למשתמש.
  async function openInstalledPlugin(pluginId, btn) {
    if (!pluginId) return;
    try {
      await Otzaria.call('plugin.openOther', { pluginId });
    } catch {
      if (btn) btn.textContent = t('לא ניתן לפתוח את התוסף');
    }
  }

  function getAvailableUpdates() {
    return installedPlugins.flatMap(inst => {
      if (inst.isDev) return [];
      // מציגים עדכון רק אם הגרסה בחנות גבוהה מהמותקנת — לא אם המותקנת גבוהה יותר.
      const newer = allPlugins.find(p => matchesInstalled(p, inst) && compareVersions(p.version, inst.version) > 0);
      return newer ? [{ installed: inst, plugin: newer }] : [];
    });
  }

  function showUpdatesModal(updates) {
    document.getElementById('updates-title').textContent =
      t('עדכונים זמינים ({n})', { n: updates.length });

    const list = document.getElementById('updates-list');
    list.innerHTML = '';
    updates.forEach(({ installed, plugin }) => {
      const downloadUrl = plugin.downloadUrl.startsWith('http')
        ? plugin.downloadUrl : BASE + plugin.downloadUrl;
      const row = document.createElement('div');
      row.className = 'update-row';
      row.innerHTML = `
        ${pluginIconHtml(plugin, 'plugin-icon-sm')}
        <div class="update-info">
          <div class="update-name" dir="auto" title="${esc(plugin.name)}">${esc(plugin.name)}</div>
          <div class="update-versions">${esc(t('{from} ← {to}', { from: installed.version, to: plugin.version }))}</div>
        </div>
        <button class="btn btn-tonal update-btn" type="button" data-url="${esc(downloadUrl)}" data-update="1">${esc(t('עדכן'))}</button>`;
      list.appendChild(row);
    });

    // שורה שהעדכון בה הצליח יורדת מהרשימה; כשהרשימה מתרוקנת החלונית נסגרת,
    // כדי שלא תישאר פתוחה עם רשימה שכבר אינה רלוונטית.
    function settleRow(row, result) {
      if (result !== 'success') return;
      setTimeout(() => {
        row.remove();
        if (!list.querySelector('.update-row')) hide('updates-backdrop');
        else document.getElementById('updates-title').textContent =
          t('עדכונים זמינים ({n})', { n: list.querySelectorAll('.update-row').length });
      }, 900);
    }

    list.querySelectorAll('.update-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const result = await installPluginTracked(btn, btn.dataset.url, true, false);
        settleRow(btn.closest('.update-row'), result);
      });
    });

    const updateAllBtn = document.getElementById('update-all-btn');
    updateAllBtn.disabled = false;
    updateAllBtn.textContent = t('עדכן הכל');
    updateAllBtn.onclick = async () => {
      updateAllBtn.disabled = true;
      updateAllBtn.textContent = t('מעדכן...');
      const btns = [...list.querySelectorAll('.update-btn:not(:disabled)')];
      const results = [];
      for (const btn of btns) {
        const result = await installPluginTracked(btn, btn.dataset.url, true, false);
        results.push(result);
        settleRow(btn.closest('.update-row'), result);   // מוריד מהרשימה מה שהצליח
      }
      updateAllBtn.textContent = t('הושלם ✓');
      // כל העדכונים הצליחו — סוגרים את החלונית אחרי רגע קצר של משוב.
      // אם משהו נכשל/לא דווח, משאירים פתוח כדי שיהיה אפשר לנסות שוב.
      if (results.length && results.every(r => r === 'success')) {
        setTimeout(() => hide('updates-backdrop'), 900);
      } else if (results.some(r => r !== 'success')) {
        updateAllBtn.disabled = false;
        updateAllBtn.textContent = t('נסה שוב את מה שנכשל');
      }
    };

    show('updates-backdrop');
  }

  document.getElementById('updates-close').onclick = () => hide('updates-backdrop');
  document.getElementById('updates-backdrop').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) hide('updates-backdrop');
  });

  // ── תוספים חדשים בחנות ──────────────────────────────────────────
  // מפתח v2: הזהות נשמרת לפי id היציב (ולא לפי השם שעלול להשתנות).
  // החלפת המפתח מהגרסה הישנה (שמות) גורמת לטעינה הראשונה רק לשמור, בלי הודעה.
  const KNOWN_KEY = 'otzaria_store_known_plugins_v2';

  function checkNewPlugins() {
    let known = null;
    try { known = JSON.parse(localStorage.getItem(KNOWN_KEY)); } catch {}

    const currentIds = allPlugins.map(p => p.id);
    try { localStorage.setItem(KNOWN_KEY, JSON.stringify(currentIds)); } catch {}

    // בטעינה הראשונה (אין נתון קודם) רק שומרים, בלי הודעה
    if (!Array.isArray(known)) return;

    const knownSet = new Set(known);
    // תוסף שכבר מותקן אצל המשתמש אינו "חדש בחנות", גם אם נכנס לקטלוג עכשיו
    const newPlugins = allPlugins.filter(p =>
      !knownSet.has(p.id) && !findInstalled(p));
    if (newPlugins.length > 0) showNewToast(newPlugins);
  }

  function showNewToast(newPlugins) {
    // תור התוספים החדשים שעוד לא נצפו
    let pending = newPlugins.slice();

    function update() {
      if (pending.length === 0) { hide('new-toast'); return; }
      document.getElementById('new-toast-text').textContent = pending.length === 1
        ? t('תוסף חדש בחנות!')
        : t('{n} תוספים חדשים בחנות!', { n: pending.length });
      show('new-toast');
    }

    document.getElementById('new-toast-view').onclick = () => {
      const next = pending.shift();   // מסירים את הראשון מהתור
      update();                       // ההודעה נשארת עם השאר שעוד לא נצפו
      showDetail(next);
    };

    update();
  }

  document.getElementById('new-toast-close').onclick = () => hide('new-toast');

  // ── רענון ────────────────────────────────────────────────────────
  const refreshBtn = document.getElementById('refresh-btn');
  refreshBtn.addEventListener('click', () => {
    if (refreshBtn.classList.contains('spinning')) return;
    reload();
  });

  async function reload() {
    refreshBtn.classList.add('spinning');
    hide('grid'); hide('empty'); hide('error'); hide('home'); hide('view-title');
    show('loading');
    allPlugins = [];
    installedPlugins = [];
    try {
      const [catalogRes, installedRes, homeRes] = await Promise.all([
        apiFetch(withAppVersion(API)),
        Otzaria.call('plugin.listInstalled', {}),
        // דף הבית האצור — כשל בו אינו מפיל את החנות (נופלים ל"כל התוספים")
        apiFetch(withAppVersion(BASE + '/api/plugins/store-home')).catch(() => null),
      ]);
      if (catalogRes.status !== 200) throw new Error(`HTTP ${catalogRes.status}`);
      const rawCatalog = JSON.parse(catalogRes.body);
      // לכל תוסף בוחרים את הגרסה הגבוהה ביותר התואמת לגרסת אוצריא של המשתמש
      // (לא בהכרח האחרונה). תוסף שאין לו אף גרסה תואמת — מוסר מהרשימה. כך
      // המשתמש רואה ומתעדכן לגרסה התומכת גם אם הגרסה האחרונה אינה תואמת אצלו.
      allPlugins = rawCatalog.map(toEffectivePlugin).filter(Boolean);
      if (installedRes.success) {
        adoptInstalledList(installedRes.data);
      }
      storeHome = null;
      if (homeRes && homeRes.status === 200) {
        try { storeHome = JSON.parse(homeRes.body); } catch { /* נופלים ל"כל התוספים" */ }
      }
      categoryCache = new Map();
      // אצירה ריקה או כשל בטעינתה → ברירת המחדל היא הרשימה המלאה
      if (currentView.type === 'home' && !hasCuratedHome()) currentView = { type: 'all' };
      initTags();
      initCatsBar();
      renderCurrentView();
      hide('new-toast');
      checkNewPlugins();
      const updates = getAvailableUpdates();
      if (updates.length > 0) showUpdatesModal(updates);
    } catch (e) {
      showLoadError(e);
    }
    hide('loading');
    refreshBtn.classList.remove('spinning');
  }

  // ── ערכת צבעים: כל תפקידי הצבע מגיעים מ-theme האמיתי של אוצריא ─────────
  //    (משטחים, טקסט, קווים, primary/secondaryContainer, שגיאה, inverse, scrim).
  //    הפלטה ב-:root (של אתר החנות) היא רק ברירת מחדל אם theme לא נמסר. שכבות
  //    הריחוף נגזרות ב-CSS (color-mix), ולכן אין כאן חישובי צבע. דירוג ותגי מצב
  //    נשארים מקומיים (אין להם תפקיד מתאים ב-Material של אוצריא) — ראה body.dark-mode.

  // גופן הממשק בלבד: uiFontFamily (מ-0.9.97). fontFamily של ה-theme הוא גופן
  // קריאת הספרים — גופן עם תגיות שמצויר ל-25px, ובכפתור בן 12px הוא יוצא מטושטש
  // (DESIGN_GUIDE § "גופן ממשק ≠ גופן קריאה"). מארח ישן אינו שולח את השדה,
  // ואז נשמרת ברירת המחדל שב-CSS.
  function applyTypography(typography) {
    const ui = typography && typography.uiFontFamily;
    if (!ui) return;
    document.documentElement.style.setProperty(
      '--font-ui', `'${ui}', 'Segoe UI', system-ui, sans-serif`);
  }

  function applyTheme(theme) {
    if (!theme) return;
    const dark = theme.mode === 'dark';
    document.body.classList.toggle('dark-mode', dark);
    applyTypography(theme.typography);
    const cs = theme.colorScheme;
    if (!cs) return;
    const root = document.documentElement;
    const set = (k, v) => { if (v) root.style.setProperty(k, v); };

    const high = cs.surfaceContainerHigh || cs.surface;            // רקע הסרגל העליון של אוצריא
    const container = cs.surfaceContainer || high;
    const low = cs.surfaceContainerLow || cs.surface;

    // רקעים — כמו באתר, הכרטיס תמיד "מעל" הדף: בבהיר surface הוא הבהיר ביותר, ולכן
    // הוא הכרטיס והדף surfaceContainer; בכהה surface הוא הכהה ביותר, ולכן הוא הדף
    // והכרטיס surfaceContainerLow.
    set('--color-background', dark ? cs.surface : container);    // רקע הדף מתחת לפס
    set('--color-surface', dark ? low : cs.surface);              // כרטיסים, שדות, שבבים
    set('--color-surface-container-low', low);                    // אריח הממוצע בלוח הדירוגים
    set('--color-surface-container', container);                  // אריח אייקון, מסגרת צילום מסך
    set('--color-surface-container-high', high);                  // פס הכותרת, חלונית, שלד טעינה
    set('--color-surface-container-highest', cs.surfaceContainerHighest || high);  // תג ניטרלי
    // טקסט
    set('--color-on-surface', cs.onSurface);
    set('--color-on-surface-variant', cs.onSurfaceVariant || cs.onSurface);
    // קווים — outline למסגרת שדה/כפתור, outlineVariant למפרידים ולשבבים
    set('--color-outline', cs.outline);
    set('--color-outline-variant', cs.outlineVariant || cs.outline);
    // הדגשה — כפתור מלא, מסגרת שבב נבחר, טבעת פוקוס
    set('--color-primary', cs.primary);
    set('--color-on-primary', cs.onPrimary);
    // טונלי — כפתור טונלי, שבב נבחר, אריח אייקון, תג "יציב". מארח שאינו שולח את
    // התפקיד מקבל גוון של primary מעל המשטח (קירוב של secondaryContainer).
    set('--color-secondary-container', cs.secondaryContainer
      || 'color-mix(in srgb, var(--color-primary) 16%, var(--color-surface))');
    set('--color-on-secondary-container', cs.onSecondaryContainer || cs.onSurface);
    // שגיאה
    set('--color-error', cs.error);
    set('--color-error-container', cs.errorContainer
      || 'color-mix(in srgb, var(--color-error) 14%, var(--color-surface))');
    set('--color-on-error-container', cs.onErrorContainer || cs.error);
    // הודעת "תוסף חדש" (snackbar) — המשטח ההפוך
    set('--color-inverse-surface', cs.inverseSurface || cs.onSurface);
    set('--color-on-inverse-surface', cs.onInverseSurface || cs.surface);
    set('--color-inverse-primary', cs.inversePrimary || cs.onInverseSurface || cs.surface);
    // החשכה מאחורי חלונית וצללים
    set('--color-scrim', cs.scrim || cs.shadow);
    set('--color-shadow', cs.shadow || cs.scrim);
  }

  // ה-theme והשפה מגיעים כבר ב-plugin.boot (ללא הרשאה); נתפוס אותם מוקדם ככל האפשר.
  try {
    Otzaria.on('plugin.boot', p => {
      if (p && p.theme) applyTheme(p.theme);
      if (p && p.app) setLanguage(p.app.language, p.app.locale, p.app.textDirection);
      if (p && p.app && p.app.platform) appPlatform = p.app.platform;
    });
    // עדכון חי כשהמשתמש מחליף ערכת צבעים/מצב כהה (הרשאה: events.subscribe:theme.changed)
    Otzaria.on('theme.changed', applyTheme);
    // עדכון חי כשהמשתמש מחליף את שפת הממשק (הרשאה: events.subscribe:settings.changed).
    // newValue הוא קוד השפה האפקטיבי ('he'/'en') גם כשהבחירה היא 'system'.
    Otzaria.on('settings.changed', e => {
      if (e && e.key === 'key-settings-language') setLanguage(e.newValue);
    });
  } catch {}

  // ── טעינה ראשונית ────────────────────────────────────────────────
  async function loadPlugins() {
    await new Promise(resolve => window.addEventListener('plugin.ready', resolve, { once: true }));
    // קריאה מפורשת כדי לוודא את המצב הנוכחי גם אם plugin.boot כבר חלף
    try {
      const res = await Otzaria.call('app.getTheme', {});
      if (res && res.success) applyTheme(res.data);
    } catch {}
    // כנ"ל לשפה — מוודא את שפת הממשק הנוכחית גם אם plugin.boot כבר חלף
    try {
      const loc = await Otzaria.call('app.getLocale', {});
      if (loc && loc.success) setLanguage(loc.data.language, loc.data.locale, loc.data.textDirection);
    } catch {}
    // גרסת אוצריא קבועה לאורך הריצה — מספיק למשוך פעם אחת לפני הטעינה
    try {
      const info = await Otzaria.call('app.getInfo', {});
      if (info && info.success) {
        appVersion = info.data.version;
        if (info.data.platform) appPlatform = info.data.platform;
      }
    } catch {}
    // שחזור "הסתר מותקנים" מאחסון התוסף (storage.get שורד בין פתיחות,
    // בניגוד ל-localStorage שמתאפס עם ה-webview) — לפני הרינדור הראשון.
    const saved = await persistentGet(HIDE_INSTALLED_KEY);
    if (saved !== null && saved !== undefined) {
      hideInstalled = saved === true || saved === '1';
      hideInstalledEl.checked = hideInstalled;
      try { localStorage.setItem(HIDE_INSTALLED_KEY, hideInstalled ? '1' : '0'); } catch {}
    }
    await reload();
  }

  // ── מנוע התצוגות: דף בית אצור / קטגוריה / כל התוספים / חיפוש ──────

  // "לא מותקן או שיש לו עדכון" — הבסיס לסוויץ' "הסתר מותקנים".
  function isVisibleInStore(p) {
    const inst = findInstalled(p);
    if (!inst) return true;
    if (inst.isDev) return false;
    return compareVersions(p.version, inst.version) > 0;
  }

  // מסנן אחיד לכל התצוגות: כשהסוויץ' דולק — מותקנים (ללא עדכון) מוסתרים;
  // כשכבוי — מוצגים עם כפתור במצב "מותקן ✓" / "עדכון".
  function applyInstalledFilter(list) {
    return hideInstalled ? list.filter(isVisibleInStore) : list;
  }

  // מצב ההתקנה של תוסף אצל המשתמש: 'not_installed' | 'update' | 'installed'
  function installStateOf(p) {
    const inst = findInstalled(p);
    if (!inst) return 'not_installed';
    if (inst.isDev) return 'installed';
    return compareVersions(p.version, inst.version) > 0 ? 'update' : 'installed';
  }

  // ממפה רשימת תוספים מה-API (נבחרים/קטגוריה/חיפוש) לעצמים מהקטלוג המקומי —
  // כך נשמרים סינון התאימות (toEffectivePlugin) והסדר, ומוחל סוויץ' "הסתר מותקנים".
  function toCatalogList(list) {
    const byId = new Map(allPlugins.map(p => [p.id, p]));
    return applyInstalledFilter((list || []).map(x => byId.get(x.id)).filter(Boolean));
  }

  // יש מה להציג בדף הבית האצור? (נבחרים או שורת קטגוריה עם תוכן בפועל)
  function hasCuratedHome() {
    if (!storeHome) return false;
    if (toCatalogList(storeHome.featured).length) return true;
    return (storeHome.categories || []).some(c => c.showOnHome && toCatalogList(c.plugins).length);
  }

  function clearSearch() {
    searchQuery = '';
    searchSeq++;
    clearTimeout(searchTimer);
    document.getElementById('search').value = '';
  }

  // ── סרגל הקטגוריות ──
  // שבב קטגוריה; count — מספר שקט אחרי השם, "(12)" (כמו ui/Chip באתר)
  function makeCatChip(label, key, onClick, count) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip cat-chip';
    btn.dataset.key = key;
    btn.textContent = label;
    btn.onclick = onClick;
    if (count !== undefined) {
      const span = document.createElement('span');
      span.className = 'chip-count';
      span.textContent = t('({n})', { n: fmtNum(count) });
      btn.appendChild(span);
    }
    return btn;
  }

  function initCatsBar() {
    const bar = document.getElementById('cats-bar');
    bar.innerHTML = '';
    const cats = storeHome ? (storeHome.categories || []) : [];
    if (!cats.length) { hide('cats-bar'); return; }

    if (hasCuratedHome()) {
      bar.appendChild(makeCatChip(t('בית'), 'home', () => {
        clearSearch();
        currentView = { type: 'home' };
        renderCurrentView();
      }));
    }
    cats.forEach(c => {
      bar.appendChild(makeCatChip(c.name, 'cat:' + c.slug, () => {
        clearSearch();
        currentView = { type: 'category', slug: c.slug, name: c.name };
        renderCurrentView();
      }, c.pluginCount));
    });
    // "כל התוספים" — מוצא אחרון, בסוף השורה
    bar.appendChild(makeCatChip(t('כל התוספים'), 'all', () => {
      clearSearch();
      currentView = { type: 'all' };
      renderCurrentView();
    }, storeHome.totalPublicPlugins || allPlugins.length));
    show('cats-bar');
  }

  function updateCatsBarActive() {
    const key = searchQuery ? ''
      : currentView.type === 'home' ? 'home'
      : currentView.type === 'all' ? 'all'
      : 'cat:' + currentView.slug;
    document.querySelectorAll('.cat-chip').forEach(b => {
      b.classList.toggle('active', b.dataset.key === key);
      if (b.dataset.key === key) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }

  // ── ניתוב תצוגה ──
  function renderCurrentView() {
    hide('detail-page');
    show('filters');
    document.getElementById('plugin-count').textContent = t('{n} תוספים', { n: allPlugins.length });
    if (storeHome && (storeHome.categories || []).length) show('cats-bar'); else hide('cats-bar');
    updateCatsBarActive();

    if (searchQuery) {
      hide('home'); hide('tags-wrap');
      renderSearch();
      return;
    }
    hide('view-title');
    if (currentView.type === 'home') {
      hide('tags-wrap'); hide('grid'); hide('empty');
      document.getElementById('sort-select').value = 'recommended';
      renderHome();
    } else if (currentView.type === 'category') {
      hide('tags-wrap'); hide('home');
      renderCategory();
    } else {
      hide('home');
      document.getElementById('tags-wrap').classList.remove('hidden');
      updateTagsToggle();
      render();
    }
  }

  function setViewTitle(title, sub) {
    const el = document.getElementById('view-title');
    if (!title) { hide('view-title'); return; }
    el.innerHTML = `${headingHtml(title, 'h2')}${sub ? `<p>${esc(sub)}</p>` : ''}`;
    show('view-title');
  }

  // מיון כמו באתר: 'recommended' — הסדר שהגיע (אצירה/רלוונטיות); 'newest' — פרסום ראשון;
  // 'updated' — החלפת הקובץ האחרונה. בלי תאריך (שרת ישן) — בסוף; sort יציב שומר על הסדר בשוויון.
  const SORT_DATE_FIELD = { newest: 'publishedAt', updated: 'fileUpdatedAt' };

  function sortList(list) {
    const field = SORT_DATE_FIELD[document.getElementById('sort-select').value];
    if (!field) return list;
    return [...list].sort((a, b) => (b[field] || '').localeCompare(a[field] || ''));
  }

  function fillGrid(list) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    if (!list.length) { show('empty'); hide('grid'); return; }
    hide('empty'); show('grid');
    sortList(list).forEach(p => grid.appendChild(makeCard(p)));
  }

  // ── דף הבית האצור ──
  function renderHome() {
    const home = document.getElementById('home');
    home.innerHTML = '';

    const featured = toCatalogList(storeHome.featured);
    if (featured.length) {
      const sec = document.createElement('section');
      sec.innerHTML = `<div class="home-section-head"><div class="home-section-head-text">${headingHtml(t('תוספים נבחרים'), 'h2')}</div></div>`;
      const grid = document.createElement('div');
      grid.className = 'home-grid';
      featured.forEach(p => grid.appendChild(makeCard(p)));
      sec.appendChild(grid);
      home.appendChild(sec);
    }

    (storeHome.categories || []).filter(c => c.showOnHome).forEach(c => {
      const plugins = toCatalogList(c.plugins);
      if (!plugins.length) return;
      const sec = document.createElement('section');
      const head = document.createElement('div');
      head.className = 'home-section-head';
      head.innerHTML = `
        <div class="home-section-head-text">
          ${headingHtml(c.name, 'h2')}
          ${c.description ? `<p class="home-section-desc">${esc(c.description)}</p>` : ''}
        </div>
        <button class="btn btn-text home-see-all" type="button">${esc(t('לכל הקטגוריה ({n}) ←', { n: c.pluginCount }))}</button>`;
      head.querySelector('.home-see-all').onclick = () => {
        currentView = { type: 'category', slug: c.slug, name: c.name };
        renderCurrentView();
      };
      const row = document.createElement('div');
      row.className = 'home-row scroll-x';
      plugins.forEach(p => row.appendChild(makeCard(p)));
      sec.appendChild(head);
      sec.appendChild(row);
      home.appendChild(sec);
    });

    // פס גילוי מוצנע אל הרשימה המלאה
    const strip = document.createElement('div');
    strip.className = 'home-footer-strip';
    strip.innerHTML = `${esc(t('לא מצאתם את מה שחיפשתם? '))}<button class="btn btn-text" type="button">${esc(t('עיינו בכל התוספים ({n}) ←', { n: storeHome.totalPublicPlugins || allPlugins.length }))}</button>`;
    strip.querySelector('button').onclick = () => {
      currentView = { type: 'all' };
      renderCurrentView();
    };
    home.appendChild(strip);

    show('home');
  }

  // ── דף קטגוריה ──
  async function renderCategory() {
    const { slug, name } = currentView;
    setViewTitle(name || t('קטגוריה'), '');
    if (!categoryCache.has(slug)) {
      show('loading'); hide('grid'); hide('empty');
      try {
        const res = await apiFetch(withAppVersion(`${API}/categories/${encodeURIComponent(slug)}`));
        if (res.status !== 200) throw new Error(`HTTP ${res.status}`);
        categoryCache.set(slug, JSON.parse(res.body));
      } catch (e) {
        hide('loading');
        setViewTitle(name || t('קטגוריה'), isOfflineError(e)
          ? t('אין חיבור לאינטרנט — הקטגוריה תיטען כשהמחשב יתחבר')
          : t('שגיאה בטעינת הקטגוריה — נסו לרענן'));
        fillGrid([]);
        return;
      }
      hide('loading');
      // בזמן הטעינה המשתמש אולי עבר לתצוגה אחרת
      if (searchQuery || currentView.type !== 'category' || currentView.slug !== slug) return;
    }
    const cat = categoryCache.get(slug);
    setViewTitle(cat.name, cat.description || '');
    fillGrid(toCatalogList(cat.plugins));
  }

  // ── חיפוש חכם מהשרת (עם fallback לסינון מקומי) ──
  async function renderSearch() {
    const q = searchQuery;
    const seq = ++searchSeq;
    hide('view-title'); hide('grid'); hide('empty');
    show('loading');

    let list = null;
    let relaxed = false;
    try {
      const status = document.getElementById('status-filter').value;
      const url = `${API}/search?q=${encodeURIComponent(q)}&limit=50${status !== 'all' ? `&status=${encodeURIComponent(status)}` : ''}`;
      const res = await apiFetch(withAppVersion(url));
      if (res.status === 200) {
        const data = JSON.parse(res.body);
        list = toCatalogList(data.results);
        relaxed = data.relaxed === true;
      }
    } catch { /* fallback לסינון מקומי */ }

    // תשובה ישנה או שהקלט השתנה בינתיים — נזרקת
    if (seq !== searchSeq || q !== searchQuery) return;
    hide('loading');

    if (list === null) {
      // fallback מקומי — אותה התנהגות כמו חיפוש השרת, כולל סוויץ' "הסתר מותקנים"
      const ql = q.toLowerCase();
      const status = document.getElementById('status-filter').value;
      list = applyInstalledFilter(allPlugins).filter(p => {
        if (status !== 'all' && p.status !== status) return false;
        const hay = [p.name, p.shortDescription, p.description, ...(p.tags || [])].join(' ').toLowerCase();
        return hay.includes(ql);
      });
    }

    setViewTitle(
      list.length ? t('נמצאו {n} תוצאות עבור „{q}"', { n: list.length, q }) : '',
      relaxed ? t('לא נמצאו התאמות מדויקות — מוצגות תוצאות קרובות') : ''
    );
    fillGrid(list);
  }

  // ── תגיות ────────────────────────────────────────────────────────
  function initTags() {
    const tagSet = new Set();
    allPlugins.forEach(p => (p.tags || []).forEach(tag => tagSet.add(tag)));
    const sorted = [...tagSet].sort((a, b) => a.localeCompare(b, sortLocale));

    const container = document.getElementById('tags');
    container.innerHTML = '';
    container.appendChild(makeTag(t('כל התגיות'), 'all', activeTag === 'all'));
    sorted.forEach(tag => container.appendChild(makeTag(tag, tag, activeTag === tag)));
    document.getElementById('tags-wrap').classList.remove('hidden');
    tagsExpanded = false;
    updateTagsToggle();
  }

  // הגבלת אזור התגיות ל-3 שורות עם לחצן "הצג עוד"
  let tagsExpanded = false;

  function updateTagsToggle() {
    const tags = document.getElementById('tags');
    const toggle = document.getElementById('tags-toggle');
    if (!tags.children.length || !tags.offsetParent) {
      toggle.classList.add('hidden');
      return;
    }

    const rowH = tags.children[0].offsetHeight;
    const gap = parseFloat(getComputedStyle(tags).rowGap) || 0;   // הרווח בין השורות, מה-CSS
    const collapsedMax = rowH * 3 + gap * 2;

    if (tags.scrollHeight <= collapsedMax + 1) {
      toggle.classList.add('hidden');
      tags.classList.remove('collapsed');
      tags.style.maxHeight = '';
      return;
    }

    toggle.classList.remove('hidden');
    if (tagsExpanded) {
      tags.classList.remove('collapsed');
      tags.style.maxHeight = '';
      toggle.textContent = t('הצג פחות');
    } else {
      tags.classList.add('collapsed');
      tags.style.maxHeight = collapsedMax + 'px';
      toggle.textContent = t('הצג עוד');
    }
  }

  document.getElementById('tags-toggle').addEventListener('click', () => {
    tagsExpanded = !tagsExpanded;
    updateTagsToggle();
  });

  let tagsResizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(tagsResizeTimer);
    tagsResizeTimer = setTimeout(updateTagsToggle, 150);
  });

  function makeTag(label, value, active) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip tag-btn' + (active ? ' active' : '');
    btn.textContent = label;
    btn.dataset.value = value;
    btn.onclick = () => {
      activeTag = value;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    };
    return btn;
  }

  // ── רינדור "כל התוספים" (הרשימה המלאה עם סינון תגית/סטטוס) ────────
  // חיפוש טקסט אינו מטופל כאן — searchQuery פעיל מנותב ל-renderSearch (חיפוש שרת).
  function render() {
    const status = document.getElementById('status-filter').value;

    const list = applyInstalledFilter(allPlugins).filter(p => {
      if (status !== 'all' && p.status !== status) return false;
      if (activeTag !== 'all' && !(p.tags || []).includes(activeTag)) return false;
      return true;
    });

    const countEl = document.getElementById('plugin-count');
    countEl.textContent = list.length === allPlugins.length
      ? t('{n} תוספים', { n: allPlugins.length })
      : t('{n} מתוך {total}', { n: list.length, total: allPlugins.length });

    fillGrid(list);
  }

  // כרטיס תוסף (כמו PluginCard באתר) — כל פריט במקום קבוע, כדי שהעין תעבור בקו
  // ישר לאורך שורת כרטיסים. תגיות, מפתח ותאריך עדכון אינם בכרטיס (בכוונה — רעש
  // לסריקה); הם בדף הפרטים. שם התוסף הוא כפתור שנמתח על הכרטיס כולו (CSS).
  function makeCard(p) {
    const art = document.createElement('article');
    art.className = 'card';

    const downloadUrl = p.downloadUrl.startsWith('http') ? p.downloadUrl : BASE + p.downloadUrl;

    art.innerHTML = `
      <div class="card-head">
        ${pluginIconHtml(p)}
        <div class="card-head-text">
          <h3 class="card-title"><button class="card-link" type="button" dir="auto" title="${esc(p.name)}"><span class="card-title-text">${esc(p.name)}</span></button></h3>
          ${pluginMetaHtml(p)}
        </div>
      </div>
      <p class="card-desc" dir="auto">${esc(p.shortDescription || '')}</p>
      <div class="card-actions">
        ${installButtonHtml(p, downloadUrl, 'btn btn-tonal install-btn', 'btn btn-outlined')}
      </div>`;

    art.addEventListener('click', (e) => {
      if (e.target.closest('.install-btn') || e.target.closest('.open-btn')) return;
      showDetail(p);
    });

    return art;
  }

  // ── דף פרטים ────────────────────────────────────────────────────
  function showDetailPage() {
    hide('filters'); hide('cats-bar'); hide('tags-wrap'); hide('home'); hide('view-title');
    hide('grid'); hide('empty'); hide('loading'); hide('error');
    document.getElementById('plugin-count').textContent = '';
    show('detail-page');
    scrollContentTop();
  }

  // הגלילה חיה ב-.app-content (פס הכותרת קבוע) — מעבר בין תצוגות מחזיר אותה לראש
  function scrollContentTop() {
    const c = document.getElementById('app-content');
    if (c) c.scrollTop = 0;
  }

  // חזרה מדף פרטים — אל התצוגה שממנה הגיע המשתמש (בית/קטגוריה/הכול/חיפוש)
  function showListPage() {
    renderCurrentView();
    scrollContentTop();
  }

  // דף התוסף (כמו עמוד התוסף באתר): ראש העמוד — אייקון, שם, תג סטטוס, תיאור קצר
  // ופעולה; רצועת נתוני המפתח; ומתחת אזורים עם כותרת: צילומי מסך, תיאור מלא (רק
  // כשהוא שונה מהקצר), מידע כללי ותגיות, ודירוג המשתמשים.
  function showDetail(p) {
    showDetailPage();

    const downloadUrl = p.downloadUrl.startsWith('http') ? p.downloadUrl : BASE + p.downloadUrl;
    const screenshots = (p.screenshots || []).map(s => s.startsWith('http') ? s : BASE + s);
    const shortDesc = String(p.shortDescription || '').trim();
    const fullDesc = String(p.description || '').trim();
    const heroDesc = shortDesc || fullDesc;
    const showAbout = !!fullDesc && fullDesc !== heroDesc;

    const infoSection = `
      <section class="detail-section">
        ${headingHtml(t('מידע כללי'), 'h3', 'section-head')}
        <dl class="info-list">${infoRowsHtml(p)}</dl>
        ${(p.tags || []).length > 0 ? `
        <p class="detail-sub">${esc(t('תגיות'))}</p>
        <div class="detail-tags">
          ${p.tags.map(tag => `<button class="chip detail-tag" type="button" data-tag="${esc(tag)}">${esc(tag)}</button>`).join('')}
        </div>` : ''}
      </section>`;
    const ratingSection = `
      <section class="detail-section">
        ${headingHtml(t('דירוג המשתמשים'), 'h3', 'section-head')}
        ${ratingPanelHtml(p)}
      </section>`;

    const detail = document.getElementById('detail-page');
    detail.innerHTML = `
      <button class="btn btn-text back-btn" id="back-btn" type="button">${ARROW_BACK_ICON}${esc(t('חזרה לחנות'))}</button>
      <div>
        <div class="detail-hero-head">
          ${pluginIconHtml(p, 'plugin-icon-hero')}
          <div class="detail-hero-text">
            ${headingHtml(p.name, 'h2', '', 'detail-name')}
            <div class="detail-badges">
              <span class="badge badge-md ${statusClass[p.status] || ''}">${esc(statusLabel(p.status) || p.status)}</span>
            </div>
          </div>
        </div>
        ${heroDesc ? `<div class="detail-desc" dir="auto">${esc(heroDesc)}</div>` : ''}
        <div class="detail-actions">
          ${installButtonHtml(p, downloadUrl, 'btn btn-md btn-filled detail-install-btn', 'btn btn-md btn-outlined detail-install-btn is-open')}
        </div>
      </div>
      ${keyFactsHtml(p)}
      ${p.newerIncompatibleVersion ? `
      <div class="detail-notice">${INFO_ICON}<div><strong>${esc(t('שים לב'))}:</strong> ${esc(t('מוצגת הגרסה התואמת לגרסת אוצריא שלך. קיימת גרסה חדשה יותר ({v}) הדורשת גרסת אוצריא מתקדמת יותר.', { v: p.newerIncompatibleVersion }))}</div></div>` : ''}
      <div class="detail-sections">
        ${screenshots.length > 0 ? `
        <section class="detail-section">
          ${headingHtml(t('צילומי מסך'), 'h3', 'section-head')}
          <div class="screenshots-row scroll-x">
            ${screenshots.map(s => `<img class="screenshot-thumb" src="${esc(s)}" alt="${esc(t('צילום מסך'))}" loading="lazy">`).join('')}
          </div>
        </section>` : ''}
        ${showAbout ? `
        <div class="detail-columns has-desc">
          <section class="detail-section">
            ${headingHtml(t('תיאור'), 'h3', 'section-head')}
            <div class="detail-about" dir="auto">${esc(fullDesc)}</div>
          </section>
          ${infoSection}
        </div>
        ${ratingSection}` : `
        <div class="detail-columns">
          ${infoSection}
          ${ratingSection}
        </div>`}
      </div>`;

    document.getElementById('back-btn').onclick = showListPage;

    const detailInstallBtn = detail.querySelector('.detail-install-btn[data-url]');
    if (detailInstallBtn) {
      detailInstallBtn.addEventListener('click', (e) => {
        // אחרי התקנה מוצלחת הכפתור הזה הופך לכפתור פתיחה (בלי data-url);
        // המאזין נשאר עליו, ולכן מוודאים שלא נתחיל התקנה נוספת.
        if (!e.currentTarget.dataset.url) return;
        installPluginTracked(e.currentTarget, e.currentTarget.dataset.url, e.currentTarget.dataset.update === '1');
      });
    }

    detail.querySelectorAll('.detail-tag').forEach(tagEl => {
      tagEl.addEventListener('click', () => {
        // לחיצה על תגית → תצוגת "כל התוספים" מסוננת לפי התגית
        clearSearch();
        currentView = { type: 'all' };
        activeTag = tagEl.dataset.tag;
        document.querySelectorAll('.tag-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.value === activeTag);
        });
        renderCurrentView();
      });
    });

    detail.querySelectorAll('.screenshot-thumb').forEach(img => {
      img.addEventListener('click', () => {
        document.getElementById('lightbox-img').src = img.src;
        show('lightbox');
      });
    });
  }

  // כפתור התקנה לפי מצב: מותקן ועדכני → כפתור פתיחה (בגוון המשני); מותקן עם
  // גרסה חדשה בחנות → "עדכון"; לא מותקן → "התקנה".
  // openClassName הוא הסגנון של מצב "מותקן" — הכפתור המשני שפותח את התוסף.
  function installButtonHtml(p, downloadUrl, className, openClassName) {
    const state = installStateOf(p);
    if (state === 'installed') {
      const pluginId = installedIdOf(p);
      // בלי pluginId (אוצריא ישנה שאינה מחזירה אותו) אין מה לפתוח — נשאר מידע בלבד
      if (!pluginId) return `<button class="${openClassName || className}" type="button" disabled>${esc(t('מותקן ✓'))}</button>`;
      return `<button class="${openClassName || className} open-btn" type="button" data-plugin-id="${esc(pluginId)}" title="${esc(t('פתיחת התוסף'))}">${esc(t('מותקן ✓ · פתיחה'))}</button>`;
    }
    const label = state === 'update' ? t('עדכון') : t('התקנה');
    const icon = state === 'update' ? UPDATE_ICON : DOWNLOAD_ICON;
    return `<button class="${className}" type="button" data-url="${esc(downloadUrl)}"${state === 'update' ? ' data-update="1"' : ''}>${icon}${esc(label)}</button>`;
  }

  // ── כלים ─────────────────────────────────────────────────────────
  // אייקונים — מסלולי Material Symbols / Material Icons (Apache-2.0), מוטמעים כ-SVG
  // ב-currentColor: בלי גופן אייקונים ובלי רשת. דקורטיביים בלבד (aria-hidden) —
  // המשמעות תמיד בטקסט שלצדם.
  const svgIcon = (d, viewBox = '0 0 24 24') =>
    `<svg viewBox="${viewBox}" fill="currentColor" aria-hidden="true"><path d="${d}"/></svg>`;
  const DOWNLOAD_ICON = svgIcon('M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58-200 200ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z', '0 -960 960 960');
  const UPDATE_ICON = svgIcon('M21 10.12h-6.78l2.74-2.82c-2.73-2.7-7.15-2.8-9.88-.1-2.73 2.71-2.73 7.08 0 9.79s7.15 2.71 9.88 0C18.32 15.65 19 14.08 19 12.1h2c0 1.98-.88 4.55-2.64 6.29-3.51 3.48-9.21 3.48-12.72 0-3.5-3.47-3.53-9.11-.02-12.58s9.14-3.47 12.65 0L21 3v7.12zM12.5 8v4.25l3.5 2.08-.72 1.21L11 13V8h1.5z');
  // arrow_forward — "חזרה" מצביע ימינה ב-rtl (ב-ltr ה-CSS הופך אותו)
  const ARROW_BACK_ICON = svgIcon('M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z');
  const INFO_ICON = svgIcon('M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z');
  const CHECK_ICON = svgIcon('M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z');
  // כוכב — אותו מסלול כמו באתר; צבוע ב-currentColor, לשתי שכבות המילוי
  const STAR_ICON = svgIcon('M12 2.6l2.83 5.73 6.32.92-4.58 4.46 1.08 6.3L12 17.03l-5.65 2.98 1.08-6.3-4.58-4.46 6.32-.92z');
  // חיבור אינטרנט נדרש (feather wifi); "לא נדרש" — OFFLINE_ICON שלמטה
  const WIFI_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>';

  function fmtNum(n) {
    return (Number(n) || 0).toLocaleString(numLocale);
  }

  // גודל קובץ בתצוגה ידידותית (B/KB/MB)
  function fmtSize(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toLocaleString(numLocale, { maximumFractionDigits: 0 })} KB`;
    return `${(n / (1024 * 1024)).toLocaleString(numLocale, { maximumFractionDigits: 1 })} MB`;
  }

  // אייקון התוסף באריח (כרטיס, שורת עדכון, ראש דף הפרטים). בלי תמונה — הלוגו של
  // אוצריא בחצי הגודל. alt ריק: השם כתוב ממש לצד האייקון.
  function pluginIconHtml(p, sizeClass) {
    const src = p.image ? (p.image.startsWith('http') ? p.image : BASE + p.image) : DEFAULT_IMG;
    return `<span class="plugin-icon${sizeClass ? ' ' + sizeClass : ''}${p.image ? '' : ' is-fallback'}">`
      + `<img src="${esc(src)}" alt="" loading="lazy"></span>`;
  }

  // כותרת עם קישוט (קו דק ונקודת זהב, כמו SectionHeading באתר), מיושרת להתחלה.
  // dir="auto" — שם תוסף או קטגוריה הוא טקסט של המפתח, אולי באנגלית.
  function headingHtml(text, tag, wrapClass, titleClass) {
    return `<div class="heading-wrap${wrapClass ? ' ' + wrapClass : ''}">`
      + `<${tag} class="${titleClass || 'section-title'}" dir="auto">${esc(text)}</${tag}>`
      + `<span class="title-ornament is-start" aria-hidden="true"></span></div>`;
  }

  // "גרסה 1.2.0" — המספר ב-<bdi>, כדי שהנקודות לא יתערבבו בטקסט מימין לשמאל
  function versionHtml(v) {
    return esc(t('גרסה {v}')).replace('{v}', `<bdi>${esc(v)}</bdi>`);
  }

  // שורת המטא של כרטיס (כמו PluginMeta באתר):  ★ 4.6 (12)  ⤓ 2,473  גרסה 1.2.0 [בטא]
  // דירוג רק כשיש מדרגים — "0 כוכבים" היה נראה כדירוג גרוע ולא כהיעדר דירוג. תג
  // סטטוס רק כשהוא מוסיף מידע (בטא / ניסיוני): "יציב" הוא ברירת המחדל, ומופיע בדף הפרטים.
  function pluginMetaHtml(p) {
    const r = ratingOf(p);
    const rating = r.rated
      ? `<span class="meta-item meta-rating" title="${esc(t('דירוג ממוצע מתוך {n} מדרגים', { n: fmtNum(r.count) }))}">`
        + `${STAR_ICON}<span class="meta-strong">${esc(fmtAvg(r.avg))}</span>${esc(t('({n})', { n: fmtNum(r.count) }))}</span>`
      : '';
    const status = p.status && p.status !== 'stable'
      ? `<span class="badge ${statusClass[p.status] || ''}">${esc(statusLabel(p.status) || p.status)}</span>`
      : '';
    return `<p class="plugin-meta">${rating}`
      + `<span class="meta-item" title="${esc(t('כמות הורדות'))}">${DOWNLOAD_ICON}<span class="sr-only">${esc(t('הורדות'))}: </span>${esc(fmtNum(p.downloadCount))}</span>`
      + `<span class="meta-item meta-version"><span>${versionHtml(p.version)}</span>${status}</span>`
      + `</p>`;
  }

  // נתוני המפתח בדף הפרטים (כמו PluginKeyFacts באתר): תווית שקטה למעלה והערך
  // בולט מתחתיה — דירוג (רק כשיש), הורדות, גרסה, תאימות, מפתח.
  function keyFactsHtml(p) {
    const r = ratingOf(p);
    const facts = [];
    if (r.rated) {
      facts.push({
        label: t('דירוג'),
        title: t('דירוג ממוצע מתוך {n} מדרגים', { n: fmtNum(r.count) }),
        value: esc(fmtAvg(r.avg)),
        sub: `${starsHtml(r.avg)}${esc(t('({n})', { n: fmtNum(r.count) }))}`,
      });
    }
    facts.push({ label: t('הורדות'), value: esc(fmtNum(p.downloadCount)) });
    facts.push({ label: t('גרסה'), value: `<bdi>${esc(p.version)}</bdi>` });
    if (p.compatibleWith) facts.push({ label: t('תאימות'), value: `<bdi>${esc(p.compatibleWith)}</bdi>` });
    if (p.author) facts.push({ label: t('מפתח'), value: `<bdi>${esc(p.author)}</bdi>`, title: p.author });
    return `<dl class="key-facts">${facts.map(f => `
      <div class="key-fact"${f.title ? ` title="${esc(f.title)}"` : ''}>
        <dt>${esc(f.label)}</dt>
        <dd><span class="key-fact-value">${f.value}</span>${f.sub ? `<span class="key-fact-sub">${f.sub}</span>` : ''}</dd>
      </div>`).join('')}
    </dl>`;
  }

  // "מידע כללי" (כמו PluginInfoList באתר) — שורות תווית/ערך. גודל — רק כשידוע.
  function infoRowsHtml(p) {
    const rows = [
      [t('גרסה'), `<bdi>${esc(p.version)}</bdi>`],
      [t('סטטוס'), esc(statusLabel(p.status) || p.status)],
    ];
    if (p.author) rows.push([t('מפתח'), `<bdi>${esc(p.author)}</bdi>`]);
    if (p.updatedAt) rows.push([t('עודכן'), esc(formatDate(p.fileUpdatedAt || p.originalDate || p.updatedAt))]);
    rows.push([t('הורדות'), esc(fmtNum(p.downloadCount))]);
    if (p.pluginFileSize > 0) rows.push([t('גודל'), `<bdi>${esc(fmtSize(p.pluginFileSize))}</bdi>`]);
    if (p.compatibleWith) rows.push([t('תאימות'), `<bdi>${esc(p.compatibleWith)}</bdi>`]);
    rows.push([t('חיבור אינטרנט'),
      (p.requiresNetwork ? WIFI_ICON : OFFLINE_ICON) + esc(p.requiresNetwork ? t('נדרש') : t('לא נדרש'))]);
    return rows.map(([label, value]) => `
      <div class="info-row"><dt>${esc(label)}</dt><dd>${value}</dd></div>`).join('');
  }

  // ── דירוגים (תצוגה בלבד) ─────────────────────────────────────────
  // הדירוג נאסף באתר החנות בלבד — אין באוצריא התחברות לחשבון, ולכן כאן
  // מוצגים הנתונים שה-API מחזיר (ratingAvg/ratingCount/ratingBreakdown)
  // ואין אפשרות לדרג. שדות חסרים (API ישן) = "אין דירוגים" ולא שגיאה.
  function ratingOf(p) {
    const count = Number(p && p.ratingCount) || 0;
    const avg = Number(p && p.ratingAvg) || 0;
    return {
      count,
      avg,
      verified: Number(p && p.ratingVerifiedCount) || 0,
      breakdown: Array.isArray(p && p.ratingBreakdown) ? p.ratingBreakdown : [],
      rated: count > 0 && avg > 0,
    };
  }

  function fmtAvg(avg) {
    return Number(avg).toLocaleString(numLocale, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  }

  // חמישה כוכבים עם מילוי חלקי לפי הממוצע
  function starsHtml(avg, sizeClass) {
    const pct = Math.max(0, Math.min(Number(avg) || 0, 5)) / 5 * 100;
    const row = STAR_ICON.repeat(5);
    return `<span class="stars${sizeClass ? ' ' + sizeClass : ''}" aria-hidden="true">`
      + `<span class="stars-base">${row}</span>`
      + `<span class="stars-fill" style="width:${pct}%">${row}</span>`
      + `</span>`;
  }

  // לוח הדירוגים בדף הפרטים (כמו PluginRatingPanel באתר): הממוצע באריח, התפלגות
  // 5★→1★ והערה שהדירוג נעשה באתר. בלי דירוגים — רק "עדיין לא דורג" (חמישה פסים
  // ריקים עם 0 הם רעש).
  function ratingPanelHtml(p) {
    const r = ratingOf(p);
    const score = r.rated
      ? `<div class="rating-score">
          <div class="rating-score-num">${esc(fmtAvg(r.avg))}</div>
          ${starsHtml(r.avg, 'stars-lg')}
          <div class="rating-score-meta">${esc(t('{n} מדרגים', { n: fmtNum(r.count) }))}</div>
          ${r.verified > 0
            ? `<span class="badge badge-success" title="${esc(t('מדרגים שהתקנת התוסף אצלם נרשמה בפועל'))}">${CHECK_ICON}${esc(t('{n} דירוגים מאומתים', { n: fmtNum(r.verified) }))}</span>`
            : ''}
        </div>`
      : `<div class="rating-score">
          ${starsHtml(0, 'stars-lg')}
          <div class="rating-score-meta">${esc(t('התוסף עדיין לא דורג'))}</div>
        </div>`;
    const rows = r.rated
      ? `<div class="rating-rows">
          ${[5, 4, 3, 2, 1].map(star => {
            const count = Number(r.breakdown[star - 1]) || 0;
            const pct = r.count > 0 ? (count / r.count) * 100 : 0;
            return `<div class="rating-row">
              <span class="rating-row-star">${esc(String(star))}${STAR_ICON}</span>
              <span class="rating-bar"><span class="rating-bar-fill" style="width:${pct}%"></span></span>
              <span class="rating-row-count">${esc(fmtNum(count))}</span>
            </div>`;
          }).join('')}
        </div>`
      : '';

    return `<div class="rating-panel">
      <div class="rating-summary${r.rated ? '' : ' is-empty'}">${score}${rows}</div>
      <p class="rating-note">${esc(t('הדירוג נאסף בדף התוסף באתר החנות'))}</p>
    </div>`;
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatDate(dateStr) {
    try {
      const d = dateStr.includes('T') ? new Date(dateStr) : new Date(dateStr + 'T12:00:00Z');
      return d.toLocaleDateString(numLocale, { year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC' });
    } catch { return dateStr; }
  }

  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }

  // ── הודעת שגיאה בטעינה ───────────────────────────────────────────
  // כשאין חיבור לאינטרנט מציגים הסבר פשוט במקום הודעה טכנית (SocketException
  // וכו'), עם כפתור "נסו שוב". שאר השגיאות מוצגות כמו קודם.
  const ERROR_ICON = svgIcon('M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z');
  const OFFLINE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>';

  // האם הכשל נובע מחוסר חיבור לרשת (ולא מתשובת שרת כמו HTTP 500).
  function isOfflineError(e) {
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return true;
    const msg = String((e && e.message) || e || '');
    if (/^HTTP \d+$/.test(msg)) return false;
    return /SocketException|Failed host lookup|No address associated|Network is unreachable|network.*unreachable|Connection (refused|reset|failed|closed|timed out)|timed? ?out|ERR_INTERNET_DISCONNECTED|ERR_NAME_NOT_RESOLVED|ERR_NETWORK|Failed to fetch|NetworkError|HandshakeException|ClientException|errno|שגיאת רשת|Network error/i.test(msg);
  }

  function showLoadError(e) {
    const box = document.getElementById('error');
    const icon = document.getElementById('error-icon');
    const body = document.getElementById('error-body');
    if (isOfflineError(e)) {
      box.classList.add('offline');
      icon.innerHTML = OFFLINE_ICON;
      body.innerHTML =
        `<p class="state-title">${esc(t('אין חיבור לאינטרנט'))}</p>` +
        `<p class="state-desc">${esc(t('חנות התוספים צריכה אינטרנט כדי לעבוד. כשהמחשב יתחבר לאינטרנט — החנות תעבוד כרגיל.'))}</p>` +
        `<p class="state-desc">${esc(t('אם המחשב הזה לא אמור להיות מחובר לאינטרנט, אפשר להסיר את התוסף, או לעבור למצב "מנותק" בהגדרות התוכנה (בהגדרות של אוצריא עצמה, לא של התוסף).'))}</p>` +
        `<button class="btn btn-md btn-filled error-retry" type="button">${esc(t('נסו שוב'))}</button>`;
      body.querySelector('.error-retry').addEventListener('click', () => reload());
    } else {
      box.classList.remove('offline');
      icon.innerHTML = ERROR_ICON;
      body.innerHTML = `<p class="state-title">${esc(t('שגיאה בטעינת התוספים: {msg}', { msg: (e && e.message) || '' }))}</p>`;
    }
    show('error');
  }

  // ── מעקב תוצאת התקנה ─────────────────────────────────────────────
  // לפני ההתקנה יוצרים טוקן חד-פעמי מול ה-API של האתר, מוסרים אותו לאוצריא
  // (שמדווחת עליו הצלחה/כישלון), ועושים polling על הסטטוס כדי להציג את
  // התוצאה על הכפתור. כשל בכל שלב כאן אינו עוצר את ההתקנה — פשוט אין מעקב
  // (בדיוק ההתנהגות הישנה, "נשלח ✓").
  const POLL_INTERVAL_MS = 2000;
  const POLL_TIMEOUT_MS = 2 * 60 * 1000;

  // בקשת HTTP דרך אוצריא (network.fetchStream — היחיד שנותר מ-0.9.98; network.fetch
  // הישן הוסר). הזרם נצרך במלואו ומוחזר כתשובה אחת { status, ok, headers, body }.
  // כשל (הרשאה, allowlist, timeout, רשת) נזרק כ-Error עם ההודעה של אוצריא.
  async function apiFetch(url, options) {
    let meta = null;
    let body = '';
    try {
      for await (const chunk of Otzaria.call('network.fetchStream', { url, ...(options || {}) })) {
        if (chunk.type === 'response') meta = chunk;
        else if (chunk.type === 'data') body += chunk.body;
      }
    } catch (e) {
      throw new Error((e && e.message) || t('שגיאת רשת'));
    }
    if (!meta) throw new Error(t('שגיאת רשת'));
    return { status: meta.status, ok: meta.ok, headers: meta.headers, body };
  }

  // מאתר את התוסף בקטלוג לפי כתובת ההורדה שלו (הכפתורים נושאים רק data-url).
  function pluginByDownloadUrl(downloadUrl) {
    return allPlugins.find(p => {
      const u = p.downloadUrl.startsWith('http') ? p.downloadUrl : BASE + p.downloadUrl;
      return u === downloadUrl;
    }) || null;
  }

  function pluginIdByDownloadUrl(downloadUrl) {
    const p = pluginByDownloadUrl(downloadUrl);
    return p ? p.id : null;
  }

  // רישום התקנה/עדכון שהצליחו במפת המותקנים — כדי שכרטיסים אחרים ומעבר בין
  // תצוגות ישקפו מיד "מותקן ✓", בלי להמתין לרענון מלא של החנות.
  function markInstalled(plugin) {
    if (!plugin) return;
    const existing = findInstalled(plugin);
    if (existing) existing.version = plugin.version;
    else installedPlugins.push({ pluginId: plugin.pluginUid || null, name: plugin.name, version: plugin.version, isDev: false });
  }

  async function createInstallToken(downloadUrl) {
    const pluginId = pluginIdByDownloadUrl(downloadUrl);
    if (!pluginId) return null;
    try {
      const res = await apiFetch(`${API}/${pluginId}/install-token`, { method: 'POST' });
      if (res.status !== 200) return null;
      return JSON.parse(res.body).token || null;
    } catch { return null; }
  }

  // polling על תוצאת ההתקנה; מחזיר 'success' | 'failure' | 'no_report'.
  async function waitForInstallResult(token) {
    const startedAt = Date.now();
    while (Date.now() - startedAt < POLL_TIMEOUT_MS) {
      await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
      try {
        const res = await apiFetch(`${BASE}/api/plugins/install-result?token=${encodeURIComponent(token)}`);
        if (res.status === 404) return 'no_report';
        if (res.status !== 200) continue;
        const data = JSON.parse(res.body);
        if (data.status === 'success' || data.status === 'failure') return data.status;
      } catch { /* שגיאת רשת זמנית — ננסה שוב */ }
    }
    return 'no_report';
  }

  // התקנה/עדכון עם מעקב: מציג ספינר לאורך ההמתנה ומעדכן את הכפתור לפי
  // התוצאה שדווחה מאוצריא. הניסוח מותאם לפעולה — עדכון תוסף מותקן אינו
  // "התקנה". isUpdate נמסר מהקורא; אם לא — נגזר ממצב ההתקנה בפועל.
  // offerOpen=false — הכפתור לא יהפוך לכפתור פתיחה בסיום. כך בחלונית העדכונים,
  // שבה שורה שהצליחה יורדת מהרשימה אחרי רגע (ואין טעם בכפתור שייעלם).
  async function installPluginTracked(btn, downloadUrl, isUpdate, offerOpen = true) {
    const plugin = pluginByDownloadUrl(downloadUrl);
    const updating = isUpdate !== undefined
      ? isUpdate
      : Boolean(plugin && installStateOf(plugin) === 'update');
    const words = updating
      ? { progress: t('מעדכן...'), success: t('עודכן בהצלחה!'), successOpen: t('עודכן בהצלחה! לחצו לפתיחה'), failure: t('העדכון נכשל - לחץ שוב לנסיון נוסף') }
      : { progress: t('מתקין...'), success: t('הותקן בהצלחה!'), successOpen: t('הותקן בהצלחה! לחצו לפתיחה'), failure: t('ההתקנה נכשלה - לחץ שוב לנסיון נוסף') };

    btn.disabled = true;
    btn.innerHTML = `<span class="btn-spinner"></span>${esc(words.progress)}`;
    const token = await createInstallToken(downloadUrl);
    try {
      await Otzaria.call('plugin.requestInstall', {
        url: downloadUrl,
        ...(token ? { token, callback: `${BASE}/api/plugins/install-result` } : {}),
      });
    } catch (err) {
      btn.disabled = false;
      btn.textContent = t('שגיאה');
      return 'failure';
    }
    // ללא טוקן אין מעקב — לא מסמנים כמותקן כדי לא להצהיר על תוצאה שאינה ידועה
    if (!token) { btn.textContent = t('נשלח ✓'); return 'no_report'; }

    const result = await waitForInstallResult(token);
    if (result === 'success') {
      btn.textContent = words.success;
      // רענון מאוצריא כדי לקבל את ה-pluginId של מה שזה עתה הותקן; markInstalled
      // אחריו, כדי שהגרסה החדשה תירשם גם אם אוצריא עדיין לא הספיקה לרשום אותה.
      await refreshInstalledFromApp();
      markInstalled(plugin);
      const pluginId = offerOpen ? installedIdOf(plugin) : null;
      if (pluginId) makeOpenButton(btn, pluginId, words.successOpen);
    } else if (result === 'failure') {
      btn.disabled = false;
      btn.textContent = words.failure;
    } else {
      btn.textContent = t('נשלח ✓');
    }
    return result;
  }

  // הופך כפתור התקנה/עדכון שסיים בהצלחה לכפתור פתיחה — הודעת ההצלחה עצמה
  // היא הלחצן, ולחיצה עליה מעבירה לתוסף.
  function makeOpenButton(btn, pluginId, label) {
    btn.classList.remove('install-btn', 'update-btn');
    btn.classList.add('open-btn');
    btn.removeAttribute('data-url');
    btn.removeAttribute('data-update');
    btn.dataset.pluginId = pluginId;
    btn.title = t('פתיחת התוסף');
    btn.textContent = label;
    btn.disabled = false;
  }

  // כפתורי פתיחה קיימים בכרטיסים, בדף הבית, בדף הפרטים ובחלונית העדכונים —
  // מאזין אחד ברמת המסמך חוסך שכפול בכל מקום.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.open-btn');
    if (!btn) return;
    e.stopPropagation();
    openInstalledPlugin(btn.dataset.pluginId, btn);
  });

  document.getElementById('grid').addEventListener('click', (e) => {
    const btn = e.target.closest('.install-btn');
    if (!btn) return;
    installPluginTracked(btn, btn.dataset.url, btn.dataset.update === '1');
  });

  // כפתורי התקנה גם בכרטיסי דף הבית האצור (נבחרים ושורות קטגוריה)
  document.getElementById('home').addEventListener('click', (e) => {
    const btn = e.target.closest('.install-btn');
    if (!btn) return;
    installPluginTracked(btn, btn.dataset.url, btn.dataset.update === '1');
  });

  document.getElementById('lightbox-close').onclick = () => hide('lightbox');
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) hide('lightbox');
  });

  // חיפוש: debounce קצר ואז חיפוש חכם בשרת; ריקון מחזיר לתצוגה הנוכחית
  document.getElementById('search').addEventListener('input', (e) => {
    searchQuery = e.target.value.trim();
    clearTimeout(searchTimer);
    if (!searchQuery) {
      searchSeq++;
      renderCurrentView();
      return;
    }
    searchTimer = setTimeout(renderCurrentView, 300);
  });
  document.getElementById('status-filter').addEventListener('change', renderCurrentView);
  // בדף הבית אין רשימה למיין — מיון בפועל עובר ל"כל התוספים"
  document.getElementById('sort-select').addEventListener('change', (e) => {
    if (!searchQuery && currentView.type === 'home' && e.target.value !== 'recommended') {
      currentView = { type: 'all' };
    }
    renderCurrentView();
  });

  // סוויץ' "הסתר מותקנים" — שמירת הבחירה + רענון; אם דף הבית התרוקן עוברים לרשימה
  const hideInstalledEl = document.getElementById('hide-installed');
  hideInstalledEl.checked = hideInstalled;
  hideInstalledEl.addEventListener('change', () => {
    hideInstalled = hideInstalledEl.checked;
    try { localStorage.setItem(HIDE_INSTALLED_KEY, hideInstalled ? '1' : '0'); } catch {}
    persistentSet(HIDE_INSTALLED_KEY, hideInstalled);
    if (currentView.type === 'home' && !hasCuratedHome()) currentView = { type: 'all' };
    renderCurrentView();
  });

  loadPlugins();
</script>
</body>
</html>
